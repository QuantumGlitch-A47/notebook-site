  </header>

<script>
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const VT=rows=>`<div class="tablebox"><table class="vars"><tr><th>Symbol</th><th>Meaning</th><th>Units</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`;
const TB=(head,rows,cls)=>`<div class="tablebox"><table class="vars ${cls||''}"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const SL=(id,label,min,max,step,v)=>`<div class="ctrl"><label for="${id}"><span>${label}</span><span id="${id}v"></span></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
const LE='Λ<sub>LE</sub>', cr='c<sub>r</sub>', ct='c<sub>t</sub>', cb='c̄', dd='∂';
const CLa='C<sub>Lα</sub>', Cla='C<sub>lα</sub>';

const steps=[
/* 1 */
{tag:"Step 1 · Overview",title:"Shape the wing first, then size the tail",
 what:"Part 1 has two sections. Section 1 sets the wing: its planform, its aerofoil and the devices added to it. Section 2 sets the tail: the tailplane and the fin.",
 mean:"The wing makes the lift. The tail keeps the aircraft trimmed and stable about the centre of gravity. You need the wing numbers (S, b, c̄) before you can size the tail.",
 aim:"Learn the few parameters that describe a wing and what each one does. Then size a tail with volume ratios and check trim and static stability. Later sections use these for the flight envelope and flight performance.",
 extra:`<div class="flow">
  <div class="box s"><small>Section 1</small><b>Wing geometry</b><span class="hint">S, b, AR, λ, Λ<sub>LE</sub>, dihedral, twist, i<sub>w</sub></span></div>
  <div class="arrow">→</div>
  <div class="box s"><small>Section 1</small><b>Aerofoil and 3D wing</b><span class="hint">C<sub>Lα</sub>, C<sub>Lmax</sub>, high lift devices, tips</span></div>
  <div class="arrow">→</div>
  <div class="box"><small>Section 2</small><b>Tail sizing</b><span class="hint">V<sub>H</sub>, V<sub>V</sub>, S<sub>T</sub>, S<sub>F</sub>, l<sub>T</sub>, l<sub>F</sub></span></div>
  <div class="arrow">→</div>
  <div class="box"><small>Section 2</small><b>Trim and stability</b><span class="hint">elevator range δ<sub>e</sub>, static margin K<sub>n</sub></span></div></div>
  <p class="cap">The role of the aircraft drives every choice. A fast jet fighter has highly swept wings with thin sections for supersonic flight. A small general aviation aircraft has straight wings with thicker sections for low speed flight.</p>`},

/* 2 */
{tag:"Step 2 · Section 1 · Geometry",title:"The general trapezoidal wing in five numbers",
 what:"Any straight tapered wing is fixed by its span b, root chord c<sub>r</sub>, tip chord c<sub>t</sub> and leading edge sweep Λ<sub>LE</sub>. Area, average chord, taper ratio and aspect ratio follow from these.",
 mean:"The mean geometric chord (MGC) is the chord of a rectangular wing that stands in for the whole wing. It sits at a spanwise station y<sub>MGC</sub> and is set back x<sub>MGC</sub> from the root leading edge. You use it as c̄ in tail sizing and stability.",
 aim:"Move the sliders. Watch the planform redraw and the red MGC line move. The defaults are the business jet wing of Worked Example 2.2.",
 eq:`<span class="row">S = b ( ${F(`${cr} + ${ct}`,'2')} ) <span class="note">wing area</span></span>
 <span class="row">c<sub>ave</sub> = ${F(`${cr} + ${ct}`,'2')} , &nbsp; λ = ${F(ct,cr)} , &nbsp; AR = ${F('b²','S')} = ${F('b','c<sub>ave</sub>')} <span class="note">average chord, taper ratio, aspect ratio</span></span>
 <span class="row">c<sub>MGC</sub> ≈ c<sub>MAC</sub> ≡ c̄</span>
 <span class="row">c<sub>MGC</sub> = ${F('2','3')}${cr} ( ${F('1 + λ + λ²','1 + λ')} ) , &nbsp; y<sub>MGC</sub> = ( ${F('b','6')} )( ${F('1 + 2λ','1 + λ')} ) , &nbsp; x<sub>MGC</sub> = y<sub>MGC</sub> tan ${LE}</span>`,
 extra:VT([['S','Wing area (both halves)','m²'],['b','Wing span, tip to tip','m'],[`${cr}, ${ct}`,'Root chord and tip chord','m'],['c<sub>ave</sub>','Average chord','m'],['λ','Taper ratio','none'],['AR','Aspect ratio','none'],['c<sub>MGC</sub>, c<sub>MAC</sub>, c̄','Mean geometric chord, mean aerodynamic chord, mean chord','m'],['y<sub>MGC</sub>','Spanwise distance from the centreline to the MGC','m'],['x<sub>MGC</sub>','Distance of the MGC leading edge behind the root leading edge','m'],[LE,'Leading edge sweep angle','deg']])+
 `<div class="ctrls">${SL('pfS','Wing area S (m²)',10,600,1,36)}${SL('pfAR','Aspect ratio AR',2,14,0.05,7.5)}${SL('pfL','Taper ratio λ',0.1,1,0.01,0.3)}${SL('pfSw','Sweep Λ<sub>LE</sub> (deg)',0,60,1,25)}</div>
 <div><canvas id="pfCv" height="300"></canvas><div class="cap">Top view. Solid red line: the MGC on each side. Dashed line: quarter-chord line. Thin line at the top: datum through the root leading edge.</div></div>
 <div class="readout" id="pfOut"></div>`},

/* 3 */
{tag:"Step 3 · Aspect ratio",title:"Aspect ratio: how slender the wing is",
 what:"Tip vortices cut the lift near the tip. Fuselage interference cuts the lift near the root. On a high aspect ratio wing these two regions are a smaller share of the span.",
 mean:"Wing drag is approximated by a drag polar. The induced drag factor k falls as AR rises. So a high AR wing has lower induced drag and a higher L/D.",
 aim:"Choose high AR where high L/D matters, for example a long endurance aircraft such as the RQ-4 Global Hawk. Choose low AR where low roll damping matters for manoeuvrability, for example the F-104 Starfighter.",
 eq:`<span class="row">C<sub>D</sub> = C<sub>D0</sub> + k C<sub>L</sub>² <span class="note">drag polar</span></span>
 <span class="row">k = ${F('1','π AR e')} <span class="note">increasing AR decreases induced drag</span></span>`,
 extra:VT([['C<sub>D</sub>','Wing drag coefficient','none'],['C<sub>D0</sub>','Profile drag component','none'],['k','Induced drag factor','none'],['C<sub>L</sub>','Lift coefficient','none'],['AR','Aspect ratio','none'],['e','Span efficiency factor','none']])+
 TB(['','Low aspect ratio','High aspect ratio'],[
  ['Lift curve','Shallower slope, lower C<sub>Lmax</sub>, stalls at a higher angle of attack','Steeper slope, higher C<sub>Lmax</sub>, stalls at a lower angle of attack'],
  ['Induced drag','Higher: needs more α for the same C<sub>L</sub>','Lower'],
  ['Roll damping','Less (more manoeuvrable)','More (less manoeuvrable)'],
  ['Structure','Lower mass: smaller bending moment','Higher mass: longer lever arm, larger bending moment']],'plain')+
 `<h4>Wing parameters of real aircraft</h4>`+TB(['Aircraft','Class','AR','λ','Dihedral Γ (deg)','Washout (deg)','i<sub>w</sub> (deg)','Λ<sub>LE</sub> (deg)'],[
 ['Airbus A310','Jet airliner','8.8','0.26','11.3 / 4.05','-','5.05','28'],['Boeing 767','Jet airliner','7.9','0.267','6','-','4.25','31.5'],['BAC 167 Strikemaster','Military jet','5.84','0.545','6','3','3','-'],['HS Harrier','Military jet','3.175','0.354','-12','-8','1.75','34'],['SAAB 340','Turboprop','11.0','0.375','7','-','2','3.6'],['Lockheed C-130','Turboprop','10.09','0.852','2.5','3','3','0'],['Beechcraft Bonanza','GA single','6.2','0.5','6','3','4','0'],['Cirrus SR20/22','GA single','10','0.5','4.5','0','0.25','0'],['Cessna 310','GA twin','7.3','0.674','5','3','2.5','-'],['Piper PA-31 Cheyenne','GA twin','7.22','-','5','2.5','1.5','0'],['Cessna Citation II','Business jet','7.8','-','4','3','2.5','-'],['Gates Learjet 55','Business jet','6.72','0.391','-','-','-','13']],'plain')+
 `<p class="cap">Extremes: HS Harrier AR = 3.175, SAAB 340 AR = 11.0.</p>`},

/* 4 */
{tag:"Step 4 · Taper and sweep",title:"Taper moves lift outboard. Sweep delays the shock waves",
 what:"Taper ratio λ = c<sub>t</sub>/c<sub>r</sub> changes the spanwise lift distribution. Leading edge sweep Λ<sub>LE</sub> delays the onset and reduces the strength of shock waves.",
 mean:"On an untapered wing the sectional lift coefficient falls slowly along the span. On a tapered wing it rises towards the tip, then falls fast close to the tip. This can start the stall at the tip and give a sudden, dangerous rolling moment.",
 aim:"Use washout (twist the outer sections to a lower angle of attack) to stop tip stall on tapered wings. Use sweep for aircraft that cruise close to the speed of sound.",
 eq:`<span class="row">λ = ${F(ct,cr)} <span class="note">Boeing 767: 0.267 · Lockheed C-130: 0.852</span></span>
 <span class="row">Λ<sub>LE</sub> <span class="note">Airbus A310: 28° · Beechcraft Bonanza: 0°</span></span>`,
 extra:VT([['λ','Taper ratio','none'],[`${ct}, ${cr}`,'Tip chord, root chord','m'],[LE,'Leading edge sweep angle','deg']])+
 `<div class="two"><div><h4>Why sweep</h4><ul>
 <li>Shock waves form at transonic and supersonic speeds. The speed where they start is the critical Mach number.</li>
 <li>Shocks raise drag and push the aerodynamic centre aft. That changes the static margin and so the stability.</li>
 <li>Most jet airliners cruise close to the speed of sound, so they have swept wings.</li></ul></div>
 <div><h4>Why not always sweep</h4><ul>
 <li>Straight, unswept wings are more efficient at low speed and have better stall behaviour. A swept wing has a lower C<sub>Lmax</sub> and stalls earlier than the equivalent unswept wing.</li>
 <li>Sweep moves the aerodynamic centre aft. On the Douglas DC3 it was added to fix a centre of gravity that sat too far aft.</li>
 <li>Variable sweep wings (Panavia Tornado) sweep forward at low speed and aft at high speed.</li></ul></div></div>`},

/* 5 */
{tag:"Step 5 · Dihedral, twist, incidence",title:"Dihedral, washout and the fixed wing incidence",
 what:"Dihedral: the tip sits higher than the root (anhedral: lower). Twist: the tip sits at a different incidence from the root. Fixed incidence i<sub>w</sub>: the angle at which the wing is fitted to the fuselage.",
 mean:"Dihedral stabilises the coupling between sideslip and roll. It stops the aircraft dropping a wing into the sideslip. Low wings usually get dihedral, high wings anhedral. Washout (tip incidence below root incidence) makes the tip stall last and evens out the lift along the span, which cuts induced drag.",
 aim:"Choose i<sub>w</sub> so the fuselage sits at its best angle of attack (minimum drag or maximum L/D) at the cruise mission point (CMP), the middle of the cruise. Drag the sliders to see the result.",
 eq:`<span class="row">α = α<sub>F</sub> + i<sub>w</sub> &nbsp; or &nbsp; α<sub>F</sub> = α − i<sub>w</sub></span>
 <span class="row"><span class="hl">i<sub>w</sub> = α<sub>c</sub> − α<sub>Fopt</sub></span> <span class="note">Slide example: α<sub>Fopt</sub> = 1°, α<sub>c</sub> = 4°, so i<sub>w</sub> = 3° to the fuselage datum</span></span>`,
 extra:VT([['α','Wing angle of attack','deg'],['α<sub>F</sub>','Fuselage angle of attack','deg'],['i<sub>w</sub>','Fixed wing incidence (wing chord to fuselage datum)','deg'],['α<sub>c</sub>','Wing angle of attack at the cruise mission point','deg'],['α<sub>Fopt</sub>','Optimum fuselage angle of attack in cruise','deg'],['Γ','Dihedral angle (negative = anhedral). Strikemaster 6°, Harrier −12°','deg']])+
 `<div class="ctrls">${SL('inC','Wing α at CMP, α<sub>c</sub> (deg)',0,8,0.25,4)}${SL('inF','Best fuselage α<sub>Fopt</sub> (deg)',-2,4,0.25,1)}${SL('inA','Actual wing α now (deg)',-2,10,0.25,4)}</div>
 <div><canvas id="incCv" height="230"></canvas><div class="cap" id="inCap"></div></div>
 <div class="two"><div><h4>Geometric washout</h4><p class="hint">Twist built into the structure. The spar must be twisted.</p></div>
 <div><h4>Aerodynamic washout</h4><p class="hint">A different aerofoil outboard that stalls at a higher angle of attack. Often preferred: the spar stays straight and untwisted, so manufacture is easier, mainly for composite aircraft.</p></div></div>`},

/* 6 */
{tag:"Step 6 · Planform choice",title:"Pick a planform by lift, bending, stall and roll",
 what:"A designer weighs four issues. The wing must make enough lift through good use of the span. It must not create too much bending moment. It must stall gently. Roll response must be acceptable.",
 mean:"Real lift falls near the root (fuselage) and near the tip (vortex). So the centre of lift sits inboard of the semi-span midpoint, and the root bending moment is lower than with an ideal uniform distribution. A uniform distribution helps only in cruise. It also means the whole wing stalls at once.",
 aim:"Click each planform. Read what it is good at and what it costs.",
 extra:`<div class="opts" id="gal"></div><div class="lab"><div class="desc" id="galTxt"></div><div><canvas id="galCv" height="220"></canvas><div class="cap" id="galCap"></div></div></div>`},

/* 7 */
{tag:"Step 7 · Aerofoil selection",title:"The section sets the drag bucket, C<sub>Lmax</sub>, C<sub>M</sub> and M<sub>crit</sub>",
 what:"Three main parameters describe an aerofoil: thickness, mean line and camber. Camber is the largest gap between the mean line and the chord line.",
 mean:"More camber gives more lift and a higher C<sub>Lmax</sub>. Thicker sections stall at higher angles but have more drag. A larger leading edge radius delays separation at high α. A square trailing edge on laminar sections can stop a separation bubble forming.",
 aim:"Match the section to the speed range and to the tail. Put cruise C<sub>L</sub> (and ideally climb C<sub>L</sub>) inside the drag bucket.",
 extra:TB(['Section family','What it does','Watch out for'],[
 ['NACA 6 series','Thickest point moved aft to keep a laminar boundary layer over much of the chord. Has a low drag "bucket". Used on WW2 fighters, high performance GA, business jets, trainers.','A large wing chosen for climb gives a low cruise C<sub>L</sub> that can sit outside the bucket'],
 ['NACA 23012 (2 series)','One of the most widely used sections. High L/D: low C<sub>Dmin</sub>, high C<sub>Lmax</sub>. Also used on helicopter rotor blades.','Stalls abruptly'],
 ['Supercritical','For transonic aircraft. Delays the drag rise above M<sub>crit</sub>, which can be as low as Mach 0.6 for conventional sections.','Allows less sweep, which also improves low speed handling'],
 ['Supersonic (double wedge, diamond)','Very thin. Minimises the effect of the shock waves on the surface.','Only for supersonic flight']],'plain')+
 TB(['Property','Influence on the design'],[
 ['Flow separation','Sets when and how the wing stalls. Even the C<sub>L</sub> vs α slope after stall differs between sections.'],
 ['C<sub>Lmax</sub> and stall','More camber gives a higher maximum lift coefficient.'],
 ['Pitching moment C<sub>M</sub>','Cambered sections have a negative C<sub>M</sub>. It drives longitudinal trim and so the tailplane design.'],
 ['Critical Mach number','Thick sections accelerate the flow more, so shocks form at lower Mach. Use supercritical sections for transonic flight.'],
 ['Thickness','Adds drag, but a thick inboard section allows a taller spar and more fuel volume.']],'plain')},

/* 8 */
{tag:"Step 8 · The 3D wing",title:"A real wing has a lower lift slope and a lower C<sub>Lmax</sub> than its section",
 what:"Section data come from a wind tunnel. The flow is square to the leading edge and the walls act like end plates, so there are no root or tip effects. A 3D wing has spanwise flow, a tip vortex and root interference.",
 mean:"The 3D wing needs a higher α for the same C<sub>L</sub>, so it has more drag. The higher the aspect ratio, the closer the wing gets to the 2D section.",
 aim:"Correct the 2D lift slope with AR, and the 2D C<sub>lmax</sub> with sweep. Drag the AR slider to infinity and see the two lines merge.",
 eq:`<span class="row">${CLa} = ${F(Cla,`( 1 + ${F(Cla,'π AR')} )`)} <span class="note">as AR → ∞, ${CLa} → ${Cla}</span></span>
 <span class="row">C<sub>lmax</sub> = (C<sub>lmax</sub>)<sub>root</sub> + ${F('2y<sub>MGC</sub>','b')} [ (C<sub>lmax</sub>)<sub>tip</sub> − (C<sub>lmax</sub>)<sub>root</sub> ] <span class="note">varies with section and Reynolds number along the span</span></span>
 <span class="row">y<sub>MGC</sub> = ( ${F('b','6')} )( ${F('1 + 2λ','1 + λ')} )</span>
 <span class="row"><span class="hl">C<sub>Lmax</sub> = K<sub>A</sub> C<sub>lmax</sub></span> , &nbsp; K<sub>A</sub> = 0.9 cos³ ${LE} <span class="note">for a swept wing</span></span>`,
 extra:VT([[Cla,'2D section lift curve slope','per rad'],[CLa,'3D wing lift curve slope','per rad'],['AR','Aspect ratio','none'],['C<sub>lmax</sub>','2D maximum lift coefficient (span weighted)','none'],['C<sub>Lmax</sub>','3D wing maximum lift coefficient','none'],['y<sub>MGC</sub>','Spanwise position of the mean geometric chord','m'],['b','Wing span','m'],['K<sub>A</sub>','Sweep correction factor','none'],[LE,'Leading edge sweep','deg']])+
 `<div class="ctrls">${SL('lcA','2D slope C<sub>lα</sub> (/rad)',4,7,0.01,6.28)}${SL('lcAR','Aspect ratio AR',1,30,0.1,7.5)}${SL('lcS','Sweep Λ<sub>LE</sub> (deg)',0,60,1,25)}${SL('lcM','Section C<sub>lmax</sub>',0.8,2.2,0.01,1.5)}</div>
 <div class="lab"><div class="readout" id="lcOut" style="align-content:start"></div><div><canvas id="lcCv" height="280"></canvas>
 <div class="legend"><span><i style="background:var(--muted)"></i>2D section</span><span><i style="background:var(--accent)"></i>3D wing</span><span><i style="background:var(--signal)"></i>α needed for C<sub>L</sub> = 0.5</span></div>
 <div class="cap">Straight lines through zero lift at α = 0, capped at C<sub>lmax</sub> and C<sub>Lmax</sub>. The slider values are yours to choose. 2π /rad is the thin aerofoil value.</div></div></div>`},

/* 9 */
{tag:"Step 9 · Worked Example 2.2",title:"Business jet wing: is 36 m² enough for a 90 kt stall?",

 mean:"You read C<sub>lα</sub> and C<sub>lmax</sub> from the section chart, at the Reynolds numbers of the root and tip. Then you correct them to the 3D wing with Step 8.",

 <span class="row">y<sub>MGC</sub> = ( ${F('16.43','6')} )( ${F('1.6','1.3')} ) = <span class="hb">3.370 m</span>, &nbsp; ${F('2y<sub>MGC</sub>','b')} = 0.410</span>
 <span class="row">K<sub>A</sub> = 0.9 cos³ 25° = <span class="hb">0.670</span></span>
 <span class="row">V = 90 kt = 46.30 m/s, &nbsp; Re = ${F('V c','ν')} : root 1.07×10⁷, MGC 7.6×10⁶, tip 3.2×10⁶ <span class="note">pick the chart curves (R = 3, 6, 9 ×10⁶) closest to these</span></span>

/* 10 */
{tag:"Step 10 · High lift devices",title:"Slats raise the stall angle. Flaps shift the curve up",
 what:"Wing area is set for cruise, where L = mg. Take-off and landing need more lift at low speed. High lift devices reshape the section: they add camber and often area, so C<sub>Lmax</sub> rises while S stays small.",
 mean:"Leading edge devices extend the same lift line to a higher stall angle and C<sub>Lmax</sub>. Slope and zero lift angle stay the same, so trim is unaffected. Trailing edge flaps add camber: the line moves up, C<sub>Lmax</sub> rises but stall comes at a lower α, and trim changes.",
 aim:"Shorter take-off ground run and lower approach speed. Pick a configuration to see the schematic lift curve and section shape.",
 extra:`<div class="opts" id="hlOpts"></div><div class="lab even"><div><canvas id="hlSec" height="200"></canvas><div class="cap">Section shape (schematic).</div></div><div><canvas id="hlCv" height="200"></canvas><div class="cap" id="hlCap"></div></div></div>`+
 TB(['Device','Type','How it works'],[
 ['Droop nose (hinged leading edge)','Leading edge','Nose hinges down 15° to 40° to add camber. Raises C<sub>Lmax</sub> and α<sub>stall</sub>. The upper surface must stay smooth or flow separates.'],
 ['Fixed slot','Leading edge','High pressure air passes from the lower to the upper surface and delays separation. Cannot retract, so mainly on STOL aircraft.'],
 ['Kruger flap','Leading edge','Panel under the wing swings forward. Moves the stagnation point and delays separation. Often inboard, with "bull nose" or variable camber Krugers outboard.'],
 ['Two or three position slat','Leading edge','Extends like a fixed slot at low speed, retracts in cruise to avoid drag. Three position: retracted (cruise), part extended without slot (take-off), fully extended (landing).'],
 ['Plain flap','Trailing edge','Aft part hinges down. More camber, higher C<sub>Lmax</sub>, lower α<sub>stall</sub>.'],
 ['Split flap','Trailing edge','Only the lower surface hinges down. Same effect as a plain flap.'],
 ['Slotted flap','Trailing edge','Moves aft to open a slot and deflects down. Adds area. Slot flow energises the flap upper surface, so it can deflect further.'],
 ['Double / triple slotted flap','Trailing edge','More slots, more boundary layer control, more camber and chord. Also more drag and pitching moment. Complex and heavy, so large aircraft only.'],
 ['Fowler flap','Trailing edge','Slides aft first to add chord, then rotates to add camber. The wing upper surface needs stiffening at the overlap.']],'plain')+
 `<p class="cap">Flaps and slats are usually used together: a large rise in C<sub>Lmax</sub> with only a small change in stall angle. Flaps add drag, so on take-off they are retracted as soon as a steady climb is established.</p>`},

/* 11 */
{tag:"Step 11 · Tips and other devices",title:"Wing tips, winglets, vortex generators and spoilers",
 what:"The tip shape sets where the tip vortex forms and how strong it is. The vortex shrinks the part of the wing with good 2D properties. This acts like a reduction in aspect ratio.",
 mean:"Push the vortex outboard and the effective AR rises, so induced drag falls. Any added surface must save more induced drag than it adds in skin friction, interference drag and weight.",
 aim:"Know what each device does and the slide figures: raked tip up to 7% better L/D; Whitcomb winglet 3% less cruise fuel, 2% more range, 5% shorter take-off.",
 extra:TB(['Device','Effect'],[
 ['Round or spherical tip','Inefficient. The vortex rolls up and moves inboard, cutting effective AR and raising induced drag.'],
 ['Square tip','Vortex forms slightly outboard of the tip. Better.'],
 ['Booster tip','Pushes the vortex as far outboard as possible.'],
 ['Hoerner tip','Pushes the vortex outboard. Its curved planform also improves low speed stall.'],
 ['Raked tip','Raises AR and efficiency, but the span grows. Up to 7% better L/D, depending on rake angle and tip dihedral.'],
 ['Winglet','Spreads the tip vorticity over a swept surface and weakens the vortex. Common on transonic aircraft.'],
 ['Airbus winglet (end plate)','Makes the wing act more like a 2D section. Helps stop spanwise spread of separation.'],
 ['Whitcomb winglet','Tests: 3% less fuel burn in cruise, 2% more range, 5% shorter take-off distance.'],
 ['Vortex generators','Small vanes that make local vortices and suppress separation. On the leading edge or ahead of a control surface. On nacelles ("nacelle strakes") they make a vortex over the wing at high α.'],
 ['Spoilers and airbrakes','Flush upper surface flaps that dump lift. One wing: brief roll control. Both wings: steeper descent. On landing: keep the aircraft on the ground and add drag. STOL, delta wing and very large aircraft may need extra airbrakes.']],'plain')},

/* 12 */
{tag:"Step 12 · Section 2 · Tail roles",title:"The tail trims, stabilises and controls",
 what:"The tail has a tailplane (horizontal stabiliser) and a fin (vertical stabiliser). Their main jobs are trim and stability. They also give control through the elevator and the rudder.",
 mean:"Trim: no acceleration (forces balance) and no rotation (no moment about the CG). Stability: the aircraft returns to trim when disturbed. For the tailplane, trim comes first. For the fin, directional stability comes first.",
 aim:"Balance the forces and moments. Move the wing aerodynamic centre ahead of or behind the CG and watch the tail lift change sign.",
 eq:`<span class="row">Wing AC ahead of CG: &nbsp; T = D, &nbsp; L = W − L<sub>T</sub>, &nbsp; <span class="hl">L a − L<sub>T</sub> b = 0</span> <span class="note">a = CG to wing lift, b = CG to tail lift (tail lift up)</span></span>
 <span class="row">Wing AC behind CG: &nbsp; T = D, &nbsp; L = W + L<sub>T</sub>, &nbsp; <span class="hl">L a − L<sub>T</sub>(a + b) = 0</span> <span class="note">a = CG to wing lift, b = wing lift to tail (tail lift down)</span></span>`,
 extra:VT([['T, D','Thrust, drag','N'],['L','Wing lift','N'],['W','Weight','N'],['L<sub>T</sub>','Tailplane lift (magnitude)','N'],['a, b','Lever arms as defined in each case','m']])+
 `<div class="ctrls">${SL('trD','Wing AC ahead of CG, as % of tail arm',-15,15,0.5,5)}<span class="badge" id="trB"></span></div>
 <div><canvas id="trCv" height="230"></canvas><div class="cap" id="trCap"></div></div>
 <div class="two"><div><h4>Pitch damping</h4><p class="hint">Nose pitches up, so the tail moves down. Air moves up over the tailplane and raises its angle of attack and lift by ΔL<sub>T</sub>. That pitches the nose back down.</p>
 <h4 style="margin-top:10px">Elevator</h4><p class="hint">The CG moves as fuel burns and loads change, so the tail must give different trim moments. The elevator changes the effective camber of the tailplane to do this.</p></div>
 <div><h4>Fin trim and one engine out</h4><p class="hint">Aircraft are symmetric about the xz plane, so directional trim is easy. Single engine propeller torque is trimmed with a small aileron offset. With one engine inoperative (OEI) the fin side force must balance the asymmetric thrust. A yaw disturbance raises the fin sideslip and makes a restoring yaw moment: "weathercock stability".</p></div></div>
 <div class="eq"><span class="row">Σ N<sub>G</sub> = 0: &nbsp; <span class="hl">Y<sub>F</sub> l<sub>F</sub> − T<sub>R</sub> b<sub>E</sub> = 0</span> <span class="note">OEI yaw balance, the main criterion for rudder design</span></span>
 <span class="row">Y<sub>F</sub> = ${F('1','2')}ρV<sub>f</sub>² S<sub>F</sub> C<sub>YF</sub> , &nbsp; C<sub>YF</sub> = ${F(`${dd}C<sub>YF</sub>`,`${dd}β`)} β + ${F(`${dd}C<sub>YF</sub>`,`${dd}δ<sub>r</sub>`)} δ<sub>r</sub></span></div>`+
 VT([['Y<sub>F</sub>','Fin side force','N'],['l<sub>F</sub>','Fin lever arm from the CG','m'],['T<sub>R</sub>','Thrust of the working engine','N'],['b<sub>E</sub>','Lateral offset of that engine from the CG','m'],['ρ, V<sub>f</sub>','Air density, flight speed','kg/m³, m/s'],['S<sub>F</sub>','Fin area','m²'],['C<sub>YF</sub>','Fin side force coefficient','none'],['β, δ<sub>r</sub>','Sideslip angle, rudder deflection','rad']])},

/* 13 */
{tag:"Step 13 · Tail sizing",title:"Size the tail with volume ratios from historical data",
 what:"A tail volume ratio is tail area times lever arm, divided by a wing area and a wing length. Similar aircraft have similar values. So you pick V<sub>H</sub> and V<sub>V</sub> from data, estimate the arms, and solve for the areas.",

 <span class="row">&nbsp;&nbsp;b<sub>T</sub> = √(AR S<sub>T</sub>) = 20.22 m, c<sub>ave</sub> = b<sub>T</sub>/AR = 4.49 m</span>

 `<div class="opts" id="vhOpts"></div>
 <div class="ctrls">${SL('vhH','Tailplane V<sub>H</sub>',0.3,1.2,0.01,0.8)}${SL('vhV','Fin V<sub>V</sub>',0.01,0.1,0.001,0.06)}${SL('vhT','l<sub>T</sub> / l<sub>Fus</sub>',0.35,0.6,0.01,0.49)}${SL('vhF','l<sub>F</sub> / l<sub>Fus</sub>',0.35,0.6,0.01,0.45)}</div>

 ['Airbus A330-300','361.4','7.26','60.3','72.9','28.6','0.795','45.2','27.5','0.0570','63.4'],['Boeing 777-200','427.8','8.75','60.9','101.26','27.9','0.755','53.23','26.6','0.0543','63.7'],['Airbus A350-900','440.4','9.15','64.6','81.45','32.98','0.666','51.0','27.76','0.0498','67.0'],['Airbus A340-300','361.4','7.26','60.3','72.9','28.6','0.795','45.2','27','0.0560','63.7'],['Boeing 777-300','427.8','8.75','60.9','101.26','32.95','0.891','53.23','31.65','0.0647','73.9'],['Boeing 747-400','534.9','9.68','64.4','136.6','32.5','0.857','77.1','30','0.0671','70.7']],'plain')+

/* 14 */
{tag:"Step 14 · Longitudinal trim equation",title:"From the moment balance to one coefficient equation",
 what:"Take moments about the CG G for the wing plus fuselage, the tailplane and the thrust. Divide by ½ρV<sub>f</sub>²Sc̄ to make it dimensionless. The tailplane group S<sub>T</sub>l<sub>T</sub>/(Sc̄) is the volume ratio V<sub>H</sub>.",
 mean:"M<sub>wf</sub> and Th<sub>T</sub> are often small. For trim the tailplane usually has to give a download, so L<sub>T</sub> comes out negative. The CG h and the thrust change through the flight, and V<sub>H</sub> is fixed. So the only way to trim everywhere is to change C<sub>LT</sub> with the elevator.",
 aim:"Know every line of this chain. You use it directly in the elevator range example next.",
 eq:`<span class="row">ΣF<sub>x</sub> = 0: T − D = 0 , &nbsp; ΣF<sub>z</sub> = 0: mg − L<sub>wf</sub> − L<sub>T</sub> = 0</span>
 <span class="row">ΣM<sub>G</sub> = 0: &nbsp; M<sub>wf</sub> + L<sub>wf</sub>(h − h<sub>nwf</sub>)c̄ − l<sub>T</sub>L<sub>T</sub> + T h<sub>T</sub> = 0</span>
 <span class="row">L<sub>T</sub> = ${F('1','2')}ρV<sub>f</sub>² S<sub>T</sub> C<sub>LT</sub> &nbsp;⇒&nbsp; C<sub>Mwf</sub> + C<sub>Lwf</sub>(h − h<sub>nwf</sub>) − ${F('S<sub>T</sub> l<sub>T</sub>','S c̄')} C<sub>LT</sub> + C<sub>T</sub> ${F('h<sub>T</sub>','c̄')} = 0</span>

const stage=document.getElementById('stage'), rail=document.getElementById('rail');
let cur=0, visited=new Set([0]), anim=null;
try{const s=parseInt(localStorage.getItem('aa3p1step'));if(s>=0&&s<steps.length)cur=s;}catch(e){}

steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=s.tag;b.onclick=()=>go(i);rail.appendChild(b);});

function go(i){cur=Math.max(0,Math.min(steps.length-1,i));visited.add(cur);try{localStorage.setItem('aa3p1step',cur)}catch(e){}render();}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});

function render(){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 const s=steps[cur];
 stage.innerHTML=`<div class="tag">${s.tag}</div><h2>${s.title}</h2>
 <div class="trio"><div class="cell what"><h3>What it is</h3><p>${s.what}</p></div>
 <div class="cell mean"><h3>What it means</h3><p>${s.mean}</p></div>
 <div class="cell aim"><h3>The aim</h3><p>${s.aim}</p></div></div>
 ${s.eq?`<div class="eq">${s.eq}</div>`:''}${s.extra||''}`;
 [...rail.children].forEach((b,i)=>{b.className=(i===cur?'on':visited.has(i)?'done':'');});
 document.getElementById('bar').style.width=((cur+1)/steps.length*100)+'%';
 document.getElementById('prev').disabled=cur===0;
 document.getElementById('next').disabled=cur===steps.length-1;
 setup();
}

/* ---------- drawing helpers ---------- */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function prep(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.height/(cv._dpr||1);cv._dpr=dpr;cv._h=cv._h||h;
 cv.width=w*dpr;cv.height=cv._h*dpr;cv.style.height=cv._h+'px';const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,cv._h);return[c,w,cv._h];}
const $=id=>document.getElementById(id);
const V=id=>+$(id).value;
const MONO='11px ui-monospace, Menlo, monospace';
const RD=Math.PI/180;
const subs=t=>t.replace(/_([A-Za-z\u03b1-\u03c9\u0394\u0101-\u03ff0-9]+)/g,'<sub>$1</sub>');
function out(id,items){$(id).innerHTML=items.map(([k,v,key])=>`<div${key?' class="key"':''}><small>${subs(k)}</small><b>${subs(v)}</b></div>`).join('');}
function setv(id,txt){const e=$(id+'v');if(e)e.textContent=txt;}
function poly(c,pts,fill,stroke,lw){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1.5;c.stroke();}}
function line(c,x1,y1,x2,y2,col,lw,dash){c.strokeStyle=col;c.lineWidth=lw||1;c.setLineDash(dash||[]);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.setLineDash([]);}
function txt(c,s,x,y,col,align,base,font){c.fillStyle=col||css('--muted');c.font=font||MONO;c.textAlign=align||'left';c.textBaseline=base||'alphabetic';c.fillText(s,x,y);}
function arrowV(c,x,y0,len,col,lw){/* vertical arrow from y0, len>0 up */const y1=y0-len;line(c,x,y0,x,y1,col,lw||2.5);const d=len>0?1:-1;if(Math.abs(len)<2)return;
 c.fillStyle=col;c.beginPath();c.moveTo(x,y1);c.lineTo(x-5,y1+7*d);c.lineTo(x+5,y1+7*d);c.closePath();c.fill();}
function plotAxes(c,W,H,pad,x0,x1,y0,y1,xt,yt,xl,yl,fmtx,fmty){
 const X=v=>pad.l+(v-x0)/(x1-x0)*(W-pad.l-pad.r), Y=v=>pad.t+(y1-v)/(y1-y0)*(H-pad.t-pad.b);
 c.lineWidth=1;
 for(let v=Math.ceil(x0/xt)*xt;v<=x1+1e-9;v+=xt){line(c,X(v),pad.t,X(v),H-pad.b,css('--grid'));txt(c,fmtx?fmtx(v):String(+v.toFixed(3)),X(v),H-pad.b+5,css('--muted'),'center','top');}
 for(let v=Math.ceil(y0/yt)*yt;v<=y1+1e-9;v+=yt){line(c,pad.l,Y(v),W-pad.r,Y(v),css('--grid'));txt(c,fmty?fmty(v):String(+v.toFixed(3)),pad.l-5,Y(v),css('--muted'),'right','middle');}
 if(y0<0&&y1>0)line(c,pad.l,Y(0),W-pad.r,Y(0),css('--muted'));
 if(x0<0&&x1>0)line(c,X(0),pad.t,X(0),H-pad.b,css('--muted'));
 if(xl)txt(c,xl,W-pad.r,H-pad.b-6,css('--muted'),'right');
 if(yl)txt(c,yl,pad.l+6,pad.t+10,css('--muted'),'left');
 return[X,Y];}
function trap(b,S,lam,swDeg){const cave=S/b,crr=2*cave/(1+lam);return{b,cave,cr:crr,ct:lam*crr,sw:swDeg*RD};}
function drawTrapTop(c,cx,top,g,sc,fill,stroke){/* full span, LE at top */const h=g.b/2,dx=h*Math.tan(g.sw);
 const P=(y,x)=>[cx+y*sc,top+x*sc];
 poly(c,[P(0,0),P(h,dx),P(h,dx+g.ct),P(0,g.cr),P(-h,dx+g.ct),P(-h,dx)],fill,stroke,1.5);}

/* ---------- step 2: planform ---------- */
function planform(){
 const S=V('pfS'),AR=V('pfAR'),lam=V('pfL'),sw=V('pfSw');
 setv('pfS',S.toFixed(0));setv('pfAR',AR.toFixed(2));setv('pfL',lam.toFixed(2));setv('pfSw',sw.toFixed(0)+'°');
 const b=Math.sqrt(AR*S),g=trap(b,S,lam,sw),cm=2/3*g.cr*(1+lam+lam*lam)/(1+lam),ym=b/6*(1+2*lam)/(1+lam),xm=ym*Math.tan(g.sw);
 const cv=$('pfCv'),[c,W,H]=prep(cv),pad=26,dx=b/2*Math.tan(g.sw),depth=Math.max(g.cr,dx+g.ct);
 const sc=Math.min((W-2*pad)/b,(H-2*pad-20)/depth),cx=W/2,top=pad+14;
 line(c,cx-b/4*sc,top-10,cx+b/4*sc,top-10,css('--ink'),2);txt(c,'DATUM',cx+b/4*sc+6,top-6,css('--muted'));
 drawTrapTop(c,cx,top,g,sc,css('--accent-soft'),css('--ink'));
 line(c,cx,top,cx,top+g.cr,css('--muted'),1,[2,3]);
 [1,-1].forEach(s=>{line(c,cx,top+g.cr/4*sc,cx+s*b/2*sc,top+(dx+g.ct/4)*sc,css('--accent'),1.5,[6,4]);
  line(c,cx+s*ym*sc,top+xm*sc,cx+s*ym*sc,top+(xm+cm)*sc,css('--signal'),3);});
 txt(c,'b = '+b.toFixed(2)+' m',cx,H-6,css('--ink'),'center');
 line(c,cx-b/2*sc,H-20,cx+b/2*sc,H-20,css('--muted'),1);
 txt(c,'c_r',cx+4,top+g.cr*sc/2,css('--muted'));
 txt(c,'c_MGC',cx+ym*sc+5,top+(xm+cm/2)*sc,css('--signal'));
 out('pfOut',[['Span b',b.toFixed(2)+' m'],['Root chord c_r',g.cr.toFixed(3)+' m'],['Tip chord c_t',g.ct.toFixed(3)+' m'],['c_ave',g.cave.toFixed(3)+' m'],['c_MGC',cm.toFixed(3)+' m',1],['y_MGC',ym.toFixed(3)+' m',1],['x_MGC',xm.toFixed(3)+' m',1],['y_MGC / (b/2)',(ym/(b/2)).toFixed(3)]]);
}

/* ---------- step 5: incidence ---------- */
function incidence(){
 const ac=V('inC'),af=V('inF'),a=V('inA');setv('inC',ac.toFixed(2)+'°');setv('inF',af.toFixed(2)+'°');setv('inA',a.toFixed(2)+'°');
 const iw=ac-af,aF=a-iw;

 c.save();c.translate(cx,cy);c.rotate(-aF*RD*k);
 const L=Math.min(W*0.42,320);
 c.beginPath();c.ellipse(0,0,L,22,0,0,Math.PI*2);c.fillStyle=css('--bg');c.fill();c.strokeStyle=css('--ink');c.lineWidth=1.5;c.stroke();
 line(c,-L-10,0,L+10,0,css('--accent'),1.5,[6,3]);txt(c,'fuselage datum',-L,14,css('--accent'));
 c.save();c.translate(-L*0.15,-4);c.rotate(-iw*RD*k);
 c.beginPath();c.moveTo(-60,0);c.quadraticCurveTo(-30,-14,40,-3);c.lineTo(60,0);c.quadraticCurveTo(0,6,-60,0);c.fillStyle=css('--signal');c.globalAlpha=.85;c.fill();c.globalAlpha=1;
 line(c,-70,0,80,0,css('--signal'),1.2);c.restore();c.restore();
 txt(c,'angles drawn ×4 for clarity',W-10,H-8,css('--muted'),'right');
 const diff=aF-af,col=Math.abs(diff)<0.13?css('--good'):css('--signal');
 txt(c,'i_w = '+iw.toFixed(2)+'°   α_F = '+aF.toFixed(2)+'°',14,20,css('--ink'),'left','alphabetic','600 13px ui-monospace, Menlo, monospace');
 $('inCap').innerHTML=`i<sub>w</sub> = α<sub>c</sub> − α<sub>Fopt</sub> = ${ac.toFixed(2)} − ${af.toFixed(2)} = <b>${iw.toFixed(2)}°</b>. Fuselage now at α<sub>F</sub> = α − i<sub>w</sub> = <b style="color:${col}">${aF.toFixed(2)}°</b>, `+(Math.abs(diff)<0.13?'the optimum: this is the cruise mission point.':diff>0?`${diff.toFixed(2)}° above optimum (early cruise: heavy aircraft, higher C<sub>L</sub>).`:`${(-diff).toFixed(2)}° below optimum (late cruise: lighter aircraft, lower C<sub>L</sub>).`);
}

 {const cv=$('smCv'),[c,W,H]=prep(cv),pad={l:40,r:12,t:14,b:24};
  const[X,Y]=plotAxes(c,W,H,pad,0.1,0.9,-4,2,0.1,1,'h (c̄)','C_mα',v=>v.toFixed(1),v=>v.toFixed(0));
  line(c,X(0.1),Y(awf*(0.1-hn)),X(0.9),Y(awf*(0.9-hn)),css('--accent'),2.5);
  if(hn>0.1&&hn<0.9){c.strokeStyle=css('--accent');c.lineWidth=1.5;c.beginPath();c.arc(X(hn),Y(0),5,0,7);c.stroke();}
  c.fillStyle=Cma<0?css('--good'):css('--signal');c.beginPath();c.arc(X(h),Y(Math.max(-4,Math.min(2,Cma))),6,0,7);c.fill();}
}

/* ---------- step 17: tail configurations ---------- */
const cfgs=[
 {n:'Conventional',d:'c',t:'Over 80% of aircraft. Low risk. Propwash over a low tailplane gives better pitch control at take-off on single engine propeller aircraft. Both surfaces join the fuselage where it is still strong. Hard to use with engines on the rear fuselage.',ex:'Airbus A380, Cessna 310, Saab 340, Panavia Tornado'},
 {n:'Cruciform',d:'x',t:'Tailplane near mid height on the fin. Suits tail mounted engine pods and rear loading ramps. The fin must be stronger and heavier to carry the tailplane loads. The rudder may need two sections.',ex:'Cessna Citation Sovereign, BAE Jetstream 41, Rockwell B-1 Lancer'},
 {n:'T-tail',d:'t',t:'Common with rear fuselage engines or rear loading. Fin sweep pushes the tailplane aft, so the arm grows and the area shrinks. The tailplane acts as an end plate on the fin. In cruise it sits in clean air out of the wing wake and downwash, so it can be smaller. The fin must be stronger and heavier. Deep stall risk.',ex:'Vickers VC10, Airbus A400, Embraer Phenom, King Air 200'},
 {n:'V-tail',d:'v',t:'Two surfaces with "ruddervators" replace three. Lighter, fewer moving parts. AC sits higher, so drag also adds to the pitching moment. Allows a single rear engine. Needs control mixing.',ex:'Eclipse 400, Beechcraft Bonanza, Global Hawk, MQ-1 Predator'},
 {n:'Y-tail',d:'y',t:'A V-tail plus a vertical surface that may carry a rudder. Good directional stability and roll damping. Needs control mixing. Less ground clearance for take-off and landing.',ex:'MQ-9 Reaper, Learfan'},
 {n:'H-tail / twin fin',d:'h',t:'Twin fins where height is limited, for example on carriers (F-14 height 4.88 m against Tornado 5.95 m). Fins can sit in propeller wakes. Fins act as end plates on the tailplane. Extra structural weight to carry fins at the tailplane ends.',ex:'Avro Lancaster, Shorts 360, Fairchild A-10, Grumman F-14'},
 {n:'A-tail',d:'a',t:'A variant of the inverted V-tail.',ex:'FS-28 Avispa'},
 {n:'Twin boom',d:'b',t:'Allows a pusher propeller on the centreline, and its wake over the tail helps. On GA aircraft the booms also keep people away from the propeller. Structural weight is the cost.',ex:'Cessna 337 Skymaster, OV-10 Bronco, Sea Vixen'},
 {n:'Canard',d:'k',t:'The pitch surface sits ahead of the CG and lifts upward, so the wing lifts slightly less. The canard stalls before the wing and drops the nose ("stall proofing"). That hurts take-off, needing higher ground speed. The short arm often needs a larger canard area.',ex:'Beechcraft Starship, Piaggio P180 Avanti, Velocity XL'}];
let cfSel=0;
function cfDraw(){
 [...$('cfOpts').children].forEach((b,j)=>b.classList.toggle('on',j===cfSel));const k=cfgs[cfSel];
 $('cfTxt').innerHTML=`<p><b>${k.n}</b></p><p>${k.t}</p><p class="hint">Examples: ${k.ex}</p>`;
 const cv=$('cfCv'),[c,W,H]=prep(cv),cx=W/2,gy=H*0.72,s=Math.min(W/260,H/150),ink=css('--ink'),fill=css('--accent-soft');
 const P=(x,y)=>[cx+x*s,gy-y*s];
 const body=()=>{c.beginPath();c.ellipse(cx,gy,18*s,18*s,0,0,7);c.fillStyle=css('--bg');c.fill();c.strokeStyle=ink;c.lineWidth=1.5;c.stroke();};
 const hs=(y,w)=>poly(c,[P(-w,y-2),P(w,y-2),P(w,y+2),P(-w,y+2)],fill,ink,1.5);
 const fin=(x,y0,y1,ang)=>{const dx=(y1-y0)*Math.tan(ang||0);poly(c,[P(x-3,y0),P(x+3,y0),P(x+3+dx,y1),P(x-3+dx,y1)],fill,ink,1.5);};
 if(cfSel===8){body();hs(0,70);txt(c,'canard (front view), ahead of CG',cx,H-8,css('--muted'),'center');return;}
 if(cfSel===7){[-50,50].forEach(x=>{c.beginPath();c.ellipse(cx+x*s,gy,8*s,8*s,0,0,7);c.fillStyle=css('--bg');c.fill();c.strokeStyle=ink;c.stroke();fin(x,8,60);});hs(50,58);txt(c,'two booms carry the tail',cx,H-8,css('--muted'),'center');return;}
 body();
 switch(k.d){case 'c':fin(0,18,90);hs(5,70);break;case 'x':fin(0,18,90);hs(50,60);break;case 't':fin(0,18,90);hs(90,55);break;
  case 'v':fin(0,10,85,-35*RD);fin(0,10,85,35*RD);break;case 'y':fin(0,10,80,-38*RD);fin(0,10,80,38*RD);fin(0,-18,-55);break;
  case 'h':hs(5,75);fin(-75,-25,70);fin(75,-25,70);break;case 'a':fin(0,-10,-60,-35*RD);fin(0,-10,-60,35*RD);fin(0,18,80);break;}
}

/* ---------- per-step setup ---------- */
function bind(ids,fn){ids.forEach(i=>{const e=$(i);if(e)e.oninput=fn;});fn();}
function setup(){
 if($('pfCv'))bind(['pfS','pfAR','pfL','pfSw'],planform);
 if($('incCv'))bind(['inC','inF','inA'],incidence);
 if($('gal')){gallery.forEach((g,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=g.n;b.onclick=()=>{galSel=i;galDraw(i);};$('gal').appendChild(b);});galDraw(galSel);}
 if($('lcCv'))bind(['lcA','lcAR','lcS','lcM'],liftcurve);
 if($('weOut'))bind(['weA','weR','weT'],we22);
 if($('hlCv')){hlCfg.forEach((k,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=k.n;b.onclick=()=>{hlSel=i;hlDraw();};$('hlOpts').appendChild(b);});hlDraw();}
 if($('trCv'))bind(['trD'],trimBal);
 if($('vhCurve')){vhPresets.forEach(([n,h,v])=>{const b=document.createElement('button');b.className='opt';b.textContent=`${n} (${h}, ${v})`;b.onclick=()=>{$('vhH').value=h;$('vhV').value=v;sizing();};$('vhOpts').appendChild(b);});bind(['vhH','vhV','vhT','vhF'],sizing);}
 if($('elCv'))bind(['elH'],elevator);
 if($('smCv'))bind(['smH','smV'],stat);
 if($('cfCv')){cfgs.forEach((k,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=k.n;b.onclick=()=>{cfSel=i;cfDraw();};$('cfOpts').appendChild(b);});cfDraw();}
}
let galSel=0;
const redraw=()=>{const s=steps[cur];if(!stage.querySelector('canvas'))return;
 if($('pfCv'))planform();if($('incCv'))incidence();if($('galCv'))galDraw(galSel);if($('lcCv'))liftcurve();if($('hlCv'))hlDraw();if($('trCv'))trimBal();if($('vhCurve'))sizing();if($('elCv'))elevator();if($('smCv'))stat();if($('cfCv'))cfDraw();};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(redraw,150);});
render();
</script>
