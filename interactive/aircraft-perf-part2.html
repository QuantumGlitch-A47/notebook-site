<style>

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;

  background:var(--panel);color:var(--muted);cursor:pointer}

.rail button:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}

.ctrls{display:flex;flex-wrap:wrap;gap:18px;align-items:center}

input[type=range]{width:100%;accent-color:var(--accent)}

.box.s{border-color:var(--accent);background:var(--accent-soft)}
.arrow{align-self:center;font-family:var(--f-mono);color:var(--signal);font-weight:600;font-size:14px;text-align:center}
.reveal{white-space:normal} .reveal .line{display:none} .reveal .line.show{display:block}
.reveal .line .why{font-family:var(--f-body);font-size:13px;color:var(--good);display:block;line-height:1.4;white-space:normal;margin-bottom:6px}

.opt.right{border-color:var(--accent);color:var(--accent);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.stat.key{border-color:var(--signal)} .stat.key b{color:var(--signal)}

@media (prefers-reduced-motion: reduce){.progress i{transition:none}}

  --f-display:"Space Grotesk",system-ui,sans-serif;

--bg:#ffffff;--panel:#ffffff;--ink:#111111;--muted:#5a5a55;--line:#d4d4ce;--grid:#ececea;--f-display:"Helvetica Neue",Helvetica,Arial,sans-serif;--f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light;}

<div class="wrap">
  <header>
    <div class="course">ENG3059 Aircraft Perf Des. Analysis 3 · Part 2 · Flight performance</div>
    <h1>Flight Performance: Level Flight, Descent, Landing and Take-off</h1>
  </header>
  <div class="rail" id="rail" aria-label="Steps"></div>
  <div class="progress"><i id="bar"></i></div>
  <main class="panel" id="stage" aria-live="polite"></main>
  <div class="nav">
    <button class="btn ghost" id="prev">← Back</button>
    <span class="hint">Use ← → keys to move between steps</span>
    <button class="btn" id="next">Next →</button>
  </div>
</div>

<script>
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const cD='C<sub>D</sub>', cL='C<sub>L</sub>', cD0='C<sub>D0</sub>', ga='γ', rho='ρ', sq=x=>`√(${x})`, q4=x=>`(${x})<sup>1/4</sup>`;
const vt=rows=>`<div class="tablebox"><table class="vars"><tr><th>Symbol</th><th>Meaning</th><th>Units</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`;
const sl=(id,label,min,max,step,val)=>`<div class="ctrl"><label for="${id}"><span>${label}</span><span id="${id}v"></span></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
const rev=(id,lines)=>`<div class="eq reveal" id="${id}">${lines.map(l=>`<span class="line"><span class="why">${l[0]}</span>${l[1]}</span>`).join('')}</div>
 <div class="nav"><button class="btn revBtn" data-r="${id}">Reveal next line</button><button class="btn ghost revReset" data-r="${id}">Start again</button></div>`;

/* ---------- data from the slides ---------- */
const G=9.81, RHO0=1.225;
const ISA=[[0,1.225],[500,1.1673],[1000,1.1117],[1500,1.0581],[2000,1.0065],[2500,0.9569],[3000,0.9091],[3500,0.8632],[4000,0.8191],[4500,0.7768],[5000,0.7361],[5500,0.6971],[6000,0.6597],[6500,0.6238],[7000,0.5895],[7500,0.5566],[8000,0.5252],[8500,0.4951],[9000,0.4663],[9500,0.4389],[10000,0.4127],[10500,0.3877],[11000,0.3639],[12000,0.3108],[13000,0.2655],[14000,0.2268],[15000,0.1937],[16000,0.1654],[17000,0.1413],[18000,0.1207],[19000,0.1031],[20000,0.0880]];
function rhoAt(h){for(let i=1;i<ISA.length;i++){if(h<=ISA[i][0]){const[a,ra]=ISA[i-1],[b,rb]=ISA[i];return ra+(rb-ra)*(h-a)/(b-a);}}return ISA[ISA.length-1][1];}
const AC={
 sr22:{name:'Cirrus SR22',S:13.46,A:10.12,e:0.7566,W:15123,CD0:0.0251,CLmax:1.41},
 lj:{name:'Learjet 45XR',S:28.95,A:7.33,e:0.825,W:95632,CD0:0.020,CLmax:1.30,T:31136}};
const kOf=a=>1/(Math.PI*a.A*a.e);
const vmd=(W,r,S,k,CD0)=>Math.sqrt(2*W/(r*S))*Math.pow(k/CD0,0.25);
const fmt=(v,d=0)=>(+v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});

const LJ_TABLE=`<div class="tablebox"><table class="vars"><tr><th>Learjet 45XR item</th><th>Value (SI)</th><th>Imperial</th></tr>
<tr><td>Wingspan b</td><td>14.56 m</td><td>47.78 ft</td></tr><tr><td>Wing area S</td><td>28.95 m²</td><td>311.6 ft²</td></tr>
<tr><td>Aspect ratio A</td><td>7.33</td><td></td></tr><tr><td>Gross weight W</td><td>95,632 N</td><td>21,500 lbf</td></tr>
<tr><td>Sea-level thrust T</td><td>31,136 N</td><td>2 × 3500 lbf</td></tr><tr><td>C<sub>D0</sub> clean / take-off</td><td>0.020 / 0.035</td><td></td></tr>
<tr><td>C<sub>L,max</sub> flaps up / take-off</td><td>1.30 / 1.60</td><td></td></tr><tr><td>Oswald factor e</td><td>0.825</td><td></td></tr></table></div>`;

const steps=[
/* 1 */
{tag:"Step 1 · Steady level flight",title:"Four forces, and four kinds of airspeed",
 what:"Drag D acts opposite to the velocity V. Lift L acts perpendicular to V. Thrust T acts almost along V. Weight W = m g acts straight down.",
 mean:"Steady level flight has no acceleration, so L ≈ W and T ≈ D. Lift and drag coefficients say more about the aircraft than the raw forces do.",
 aim:"Set up the force balance that every later step builds on, and know which airspeed each formula uses.",
 eq:`<span class="row">D = ½ ${rho} V² S ${cD}</span>
 <span class="row">L = ½ ${rho} V² S ${cL} ≈ W <span class="note">steady level flight</span></span>
 <span class="row">D = ${F(cD,cL)} L ≈ ${F(cD,cL)} W <span class="note">drag follows from weight and the ratio ${cD}/${cL}</span></span>`,
 extra:vt([['D, L','Drag and lift forces','N'],['W','Weight, W = m g','N'],['T','Thrust','N'],[rho,'Air density','kg/m³'],['V','True airspeed (TAS)','m/s'],['S','Wing reference area','m²'],[`${cD}, ${cL}`,'Drag and lift coefficients','none']])+
 `<div><canvas id="fLevel" height="230"></canvas><div class="cap">Force diagram in steady level flight. Arrow lengths are schematic.</div></div>
 <div class="tablebox"><table class="vars"><tr><th>Speed</th><th>Definition</th></tr>
 <tr><td>IAS</td><td>Indicated airspeed. Read from the pitot-static pressure difference, using sea-level ISA density.</td></tr>
 <tr><td>CAS</td><td>Calibrated airspeed. IAS corrected for instrument and position error.</td></tr>
 <tr><td>EAS</td><td>Equivalent airspeed. CAS corrected for compressibility.</td></tr>
 <tr><td>TAS</td><td>True airspeed. The real speed through the air.</td></tr>
 <tr><td>Mach</td><td>TAS divided by the local speed of sound.</td></tr></table></div>`,
 init:()=>drawForces(document.getElementById('fLevel'),{gamma:0,T:true})},

/* 2 */
{tag:"Step 2 · Drag polar",title:"Drag coefficient = profile drag + induced drag",
 what:"The drag polar models the aircraft drag coefficient. C<sub>D0</sub> is profile drag: pressure drag plus skin friction. The kC<sub>L</sub>² term is induced (lift-dependent) drag.",
 mean:"Induced drag comes from the energy lost in the trailing wake vortices. A slender wing (large A) has less of it. Airliners sit around 7 &lt; A &lt; 11.",
 aim:"Find k from A and e. Move the sliders: the tangent from the origin touches the polar at the best lift-to-drag ratio.",
 eq:`<span class="row">${cD} = ${cD0} + k ${cL}² <span class="note">drag polar</span></span>
 <span class="row">k = ${F('1','π A e')} , &nbsp; A = ${F('b²','S')}</span>
 <span class="row">D<sub>p</sub> = ½ ${rho} V² S ${cD0} , &nbsp; D<sub>i</sub> = ½ ${rho} V² S k ${cL}² <span class="note">profile and induced drag</span></span>`,
 extra:vt([[cD0,'Profile (zero-lift) drag coefficient','none'],['k','Induced drag factor','none'],['A','Wing aspect ratio','none'],['e','Oswald efficiency factor (e = 1 for an ideal elliptic loading)','none'],['b','Wingspan','m'],['S','Wing area','m²'],['D<sub>p</sub>, D<sub>i</sub>','Profile drag, induced drag','N']])+
 `<div class="ctrls"><div class="opts"><button class="opt" id="pSR">Cirrus SR22</button><button class="opt" id="pLJ">Learjet 45XR</button></div>
 ${sl('pA','Aspect ratio A',4,14,0.01,10.12)}${sl('pE','Oswald factor e',0.6,1,0.001,0.7566)}${sl('pC','C<sub>D0</sub>',0.012,0.04,0.0001,0.0251)}</div>
 <div class="lab"><div class="stats" id="pStats" style="align-content:flex-start"></div><div><canvas id="polar" height="260"></canvas><div class="cap">Drag polar C<sub>L</sub> against C<sub>D</sub>. The dashed tangent from the origin marks maximum C<sub>L</sub>/C<sub>D</sub>.</div></div></div>
 <div class="tablebox"><table class="vars"><tr><th>Aircraft</th><th>Range (miles)</th><th>A</th></tr>
 <tr><td>Embraer ERJ145LR</td><td>1900</td><td>7.86</td></tr><tr><td>Fokker F70</td><td>2072</td><td>8.43</td></tr>
 <tr><td>Boeing B737-800</td><td>3587</td><td>9.35</td></tr><tr><td>Airbus A320-200</td><td>3455</td><td>10.30</td></tr>
 <tr><td>Boeing B787-9</td><td>9788</td><td>10.40</td></tr><tr><td>Airbus A380-800</td><td>9212</td><td>7.53</td></tr></table></div>
 <p class="cap">Longer-range aircraft tend to have larger A, because cruise efficiency matters more. The A380 is the exception: its span is limited by the 80 m × 80 m airport footprint.</p>`,
 init:initPolar},

/* 3 */
{tag:"Step 3 · Drag against speed",title:"Profile drag rises with V², induced drag falls with 1/V²",
 what:"Put C<sub>L</sub> = 2W/(ρV²S) into the drag polar. Total drag is the sum of a term that grows with speed and a term that shrinks with speed.",
 mean:"The total drag curve has a minimum. At that speed the two parts are equal. Plotted against EAS, the curve does not depend on altitude.",
 aim:"See where minimum drag sits for a light propeller aircraft and for a business jet, and how weight moves it.",
 eq:`<span class="row">D = ½ ${rho} V² S ${cD0} + ${F('k W²','½ '+rho+' V² S')} <span class="note">profile part + induced part</span></span>
 <span class="row">½ ${rho} V² = ½ ${rho}<sub>0</sub> V<sub>E</sub>² <span class="note">so in EAS the curve is the same at every altitude</span></span>`,
 extra:vt([['V','True airspeed','m/s'],['V<sub>E</sub>','Equivalent airspeed','m/s'],[`${rho}<sub>0</sub>`,'Sea-level ISA density, 1.225','kg/m³'],['W','Weight','N'],['k, '+cD0,'Drag polar constants','none']])+
 `<div class="ctrls"><div class="opts"><button class="opt" id="dSR">Cirrus SR22</button><button class="opt" id="dLJ">Learjet 45XR</button></div>${sl('dW','Weight (% of gross)',50,100,1,100)}</div>
 <div><canvas id="dragCv" height="300"></canvas>
 <div class="legend"><span><i style="background:var(--signal)"></i>D<sub>p</sub> profile</span><span><i style="background:var(--good)"></i>D<sub>i</sub> induced</span><span><i style="background:var(--accent)"></i>D total</span></div>
 <div class="cap" id="dCap"></div></div><div class="stats" id="dStats"></div>`,
 init:initDrag},

/* 4 */
{tag:"Step 4 · Minimum-drag speed",title:"Minimise C<sub>D</sub>/C<sub>L</sub> to find V<sub>MD</sub>",
 what:"Since D ≈ (C<sub>D</sub>/C<sub>L</sub>) W, minimum drag needs minimum C<sub>D</sub>/C<sub>L</sub>. Divide the polar by C<sub>L</sub>, differentiate, set to zero.",
 mean:"At the optimum, C<sub>D</sub> = 2C<sub>D0</sub>: induced drag equals profile drag. The lift equation then turns the optimum C<sub>L</sub> into a speed.",
 aim:"Derive V<sub>MD</sub> and use it on the two aircraft from the slides.",
 eq:`<span class="row">${F(cD,cL)} = ${F(cD0,cL)} + k${cL} &nbsp;⇒&nbsp; ${F('∂','∂'+cL)}(${F(cD,cL)}) = −${F(cD0,cL+'²')} + k = 0</span>
 <span class="row">${cL} = ${sq(F(cD0,'k'))} , &nbsp; ${cD} = 2${cD0} , &nbsp; ${F(cD,cL)} = 2${sq('k '+cD0)}</span>
 <span class="row">W = ½ ${rho} V² S ${sq(cD0+'/k')} &nbsp;⇒&nbsp; <span class="hl">V<sub>MD</sub> = ${sq(F('2W',rho+' S'))} · ${q4(F('k',cD0))}</span></span>`,
 extra:vt([['V<sub>MD</sub>','Minimum-drag speed (TAS for the chosen ρ)','m/s'],[cL+', '+cD,'Lift and drag coefficients at the optimum','none'],['W','Weight','N'],[rho,'Air density','kg/m³'],['S','Wing area','m²'],['k, '+cD0,'Drag polar constants','none']])+
 `<p class="exh">Worked example: Cirrus SR22 and Learjet 45XR at gross weight, sea level ISA, flaps up</p>`+
 rev('rv4',[
  ['SR22 data: A = 10.12, e = 0.7566, W = 15,123 N, S = 13.46 m², C<sub>D0</sub> = 0.0251, ρ = 1.225 kg/m³','k = 1 / (π × 10.12 × 0.7566) = 0.04157'],
  ['Best C<sub>L</sub>/C<sub>D</sub>',`${cL} = ${sq('0.0251 / 0.04157')} = 0.777`],

const stage=document.getElementById('stage'), rail=document.getElementById('rail');
let cur=0, visited=new Set([0]), anim=null;
try{const s=parseInt(localStorage.getItem('aa3p2step'));if(s>=0&&s<steps.length)cur=s;}catch(e){}

steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=s.tag;b.onclick=()=>go(i);rail.appendChild(b);});

function go(i){cur=Math.max(0,Math.min(steps.length-1,i));visited.add(cur);try{localStorage.setItem('aa3p2step',cur)}catch(e){}render();}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});

function render(){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 const s=steps[cur];
 stage.innerHTML=`<div class="tag">${s.tag}</div><h2>${s.title}</h2>
 <div class="trio"><div class="cell what"><h3>What it is</h3><p>${s.what}</p></div>
 <div class="cell mean"><h3>What it means</h3><p>${s.mean}</p></div>
 <div class="cell aim"><h3>The aim</h3><p>${s.aim}</p></div></div>
 ${s.eq?`<div class="eq">${s.eq}</div>`:''}${s.extra||''}
`;
 [...rail.children].forEach((b,i)=>{b.className=(i===cur?'on':visited.has(i)?'done':'');});
 document.getElementById('bar').style.width=((cur+1)/steps.length*100)+'%';
 document.getElementById('prev').disabled=cur===0;
 document.getElementById('next').disabled=cur===steps.length-1;
 setup();
}

/* ---------- drawing helpers ---------- */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function prep(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.height/(cv._dpr||1);cv._dpr=dpr;cv._h=cv._h||h;
 cv.width=w*dpr;cv.height=cv._h*dpr;cv.style.height=cv._h+'px';const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,cv._h);return[c,w,cv._h];}
const MONO='11px ui-monospace, Menlo, monospace';
function niceStep(span,n){const raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<3?2:m<7?5:10)*p;}
function chart(cv,o){
 const[c,W,H]=prep(cv),pad={l:o.padL||50,r:14,t:14,b:36};
 const X=v=>pad.l+(v-o.x0)/(o.x1-o.x0)*(W-pad.l-pad.r), Y=v=>pad.t+(o.y1-v)/(o.y1-o.y0)*(H-pad.t-pad.b);
 c.font=MONO;c.lineWidth=1;
 const xs=niceStep(o.x1-o.x0,W<500?4:7),ys=niceStep(o.y1-o.y0,5),fx=o.fx||(v=>+v.toFixed(6)),fy=o.fy||(v=>+v.toFixed(6));
 for(let v=Math.ceil(o.x0/xs)*xs;v<=o.x1+1e-9;v+=xs){c.strokeStyle=css('--grid');c.beginPath();c.moveTo(X(v),pad.t);c.lineTo(X(v),H-pad.b);c.stroke();
  c.fillStyle=css('--muted');c.textAlign='center';c.textBaseline='top';c.fillText(fx(v),X(v),H-pad.b+4);}
 for(let v=Math.ceil(o.y0/ys)*ys;v<=o.y1+1e-9;v+=ys){c.strokeStyle=css('--grid');c.beginPath();c.moveTo(pad.l,Y(v));c.lineTo(W-pad.r,Y(v));c.stroke();
  c.fillStyle=css('--muted');c.textAlign='right';c.textBaseline='middle';c.fillText(fy(v),pad.l-5,Y(v));}
 c.strokeStyle=css('--muted');c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,H-pad.b);c.lineTo(W-pad.r,H-pad.b);c.stroke();
 if(o.y0<0&&o.y1>0){c.beginPath();c.moveTo(pad.l,Y(0));c.lineTo(W-pad.r,Y(0));c.stroke();}
 c.fillStyle=css('--muted');c.textAlign='right';c.textBaseline='bottom';c.fillText(o.xl||'',W-pad.r,H-2);
 c.textAlign=o.ylRight?'right':'left';c.textBaseline='top';if(o.yl){c.save();c.fillStyle=css('--muted');c.fillText(o.yl,o.ylRight?W-pad.r-4:pad.l+6,o.ylRight?H-pad.b-16:pad.t+2);c.restore();}
 return{c,X,Y,W,H,pad,o};
}
function line(g,f,a,b,col,lw,dash){const{c,X,Y,o}=g;c.save();c.beginPath();c.rect(g.pad.l,g.pad.t,g.W-g.pad.l-g.pad.r,g.H-g.pad.t-g.pad.b);c.clip();
 c.strokeStyle=col;c.lineWidth=lw||2;c.setLineDash(dash||[]);c.beginPath();let on=false;
 for(let i=0;i<=300;i++){const x=a+(b-a)*i/300,y=f(x);if(!isFinite(y)){on=false;continue;}on?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y));on=true;}c.stroke();c.restore();}
function seg(g,x0,y0,x1,y1,col,lw,dash){const{c,X,Y}=g;c.save();c.strokeStyle=col;c.lineWidth=lw||1;c.setLineDash(dash||[]);c.beginPath();c.moveTo(X(x0),Y(y0));c.lineTo(X(x1),Y(y1));c.stroke();c.restore();}
function dot(g,x,y,col,label,dx,dy){const{c,X,Y}=g;c.fillStyle=col;c.beginPath();c.arc(X(x),Y(y),5,0,Math.PI*2);c.fill();c.strokeStyle=css('--panel');c.lineWidth=2;c.stroke();
 if(label){c.font='600 11px ui-monospace, Menlo, monospace';c.fillStyle=col;c.textAlign=(dx||0)<0?'right':'left';c.textBaseline='middle';c.fillText(label,X(x)+(dx??8),Y(y)+(dy??-12));}}
function stats(id,items){document.getElementById(id).innerHTML=items.map(([k,v,key])=>`<div class="stat${key?' key':''}">${k}<b>${v}</b></div>`).join('');}
function setV(id,t){const e=document.getElementById(id+'v');if(e)e.innerHTML=t;}

function arrow(c,x,y,dx,dy,col,label,lx,ly){const L=Math.hypot(dx,dy);if(L<2)return;c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2.5;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();
 const ux=dx/L,uy=dy/L,h=9;c.beginPath();c.moveTo(x+dx,y+dy);c.lineTo(x+dx-h*ux+h*0.5*uy,y+dy-h*uy-h*0.5*ux);c.lineTo(x+dx-h*ux-h*0.5*uy,y+dy-h*uy+h*0.5*ux);c.closePath();c.fill();
 if(label){c.font='600 13px ui-monospace, Menlo, monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(label,x+dx+(lx??ux*14),y+dy+(ly??uy*14));}}
function plane(c,x,y,ang,s){c.save();c.translate(x,y);c.rotate(-ang);c.fillStyle=css('--ink');
 c.beginPath();c.ellipse(0,0,34*s,6*s,0,0,Math.PI*2);c.fill();
 c.beginPath();c.moveTo(-26*s,-2*s);c.lineTo(-36*s,-16*s);c.lineTo(-30*s,-16*s);c.lineTo(-18*s,-3*s);c.fill();
 c.fillStyle=css('--muted');c.fillRect(-6*s,-1.5*s,18*s,3*s);c.restore();}
/* gamma: + climb, − descent (radians, drawn as given) */
function drawForces(cv,o){const[c,W,H]=prep(cv);const g=o.gamma,cx=W/2,cy=H/2+8,L=Math.min(80,H*0.32);

  if(isFinite(k.SG)){line(g,k.V,0,k.SG,css('--accent'),2.8);dot(g,k.SG,0,css('--signal'),fmt(k.SG)+' m',k.SG>x1*0.8?-8:8,-12);}
  dot(g,0,k.Vtd,css('--accent'),'V_TD '+k.Vtd.toFixed(1),8,-10);
  stats('lStats',[['V<sub>stall</sub>',k.Vst.toFixed(2)+' m/s'],['V<sub>TD</sub> = 1.1 V<sub>stall</sub>',k.Vtd.toFixed(2)+' m/s'],['B',(k.B*1e6).toFixed(4)+' × 10⁻⁶'],['A',k.A.toFixed(4)],['B V<sub>TD</sub>²',(k.B*k.Vtd*k.Vtd).toFixed(5)],
   ['braking distance S<sub>G</sub>',isFinite(k.SG)?fmt(k.SG)+' m':'does not stop (A ≤ 0)',1],['free roll 1 to 3 × V<sub>TD</sub>',fmt(k.Vtd)+' to '+fmt(3*k.Vtd)+' m']]);};
 M.oninput=R.oninput=T.oninput=Sl.oninput=u;u();}

/* ---------- step 15: reverse thrust ---------- */
function initReverse(){const S=document.getElementById('rS');const base=landCalc(0.3,1.225,3000,0),B=base.B,V2=base.Vtd*base.Vtd,W=LD.W;
 const Treq=s=>{const A=B*V2/(Math.exp(2*G*B*s)-1);return(0.3-A)*W/1000;};
 const u=()=>{const s=+S.value,A=B*V2/(Math.exp(2*G*B*s)-1),T=(0.3-A)*W;setV('rS',s+' m');
  stats('rStats',[['2gB S<sub>G</sub>',(2*G*B*s).toFixed(7)],['A needed',A.toFixed(4)],['T needed',(T/1000).toFixed(2)+' kN',1],['as % of 31.1 kN',(Math.abs(T)/311.36).toFixed(1)+'% '+(T<0?'reverse':'forward')]]);
  const g=chart(document.getElementById('rCv'),{x0:150,x1:600,y0:-50,y1:10,xl:'target S_G (m)',yl:'T (kN)',fx:v=>fmt(v)});
  line(g,Treq,150,600,css('--accent'),2.8);seg(g,150,-31.136,600,-31.136,css('--signal'),1,[4,4]);g.c.fillStyle=css('--signal');g.c.font=MONO;g.c.textAlign='left';g.c.fillText('−31.1 kN (size of max forward thrust)',g.X(160),g.Y(-31.136)+12);
  dot(g,400,Treq(400),css('--muted'),'Ex 4',8,-12);dot(g,300,Treq(300),css('--muted'),'Ex 5',8,-12);dot(g,491,3,css('--muted'),'491 m, T = +3 kN',-8,-12);
  dot(g,s,T/1000,css('--signal'),'',0,0);};
 S.oninput=u;u();}

/* ---------- step 17: take-off calculator ---------- */
const TO={W:95632,S:28.95,CLmax:1.6,CL:0.8,CDCL:0.085,T:31136};
function toCalc(W,r,mu,gR){const T=TO.T*r/RHO0,Vst=Math.sqrt(2*W/(r*TO.S*TO.CLmax)),VR=1.1*Vst,D=-r*TO.S*TO.CL*(TO.CDCL-mu)/(2*W),C=T/W-mu-gR;
 const ok=C>0&&D*VR*VR+C>0,SG=ok?(Math.log(D*VR*VR+C)-Math.log(C))/(2*G*D):NaN;const V=s=>{const v2=C*(Math.exp(2*G*D*s)-1)/D;return v2>=0?Math.sqrt(v2):NaN;};return{T,Vst,VR,D,C,SG,V};}
function initTakeoff(){const M=document.getElementById('tM'),R=document.getElementById('tR'),Mu=document.getElementById('tMu'),Sl=document.getElementById('tS');
 const pre=(m,r)=>{M.value=m;R.value=r;Mu.value=0.03;Sl.value=0;u();};
 document.getElementById('tE1').onclick=()=>pre(0,1.225);document.getElementById('tE2').onclick=()=>pre(500,1.225);document.getElementById('tE3').onclick=()=>pre(0,1.0);
 const u=()=>{const m=+M.value,W=TO.W-m*G,r=+R.value,mu=+Mu.value,gR=+Sl.value;setV('tM',m+' kg · W = '+fmt(W)+' N');setV('tR',r.toFixed(3));setV('tMu',mu.toFixed(3));setV('tS',gR.toFixed(3));
  [['tE1',0,1.225],['tE2',500,1.225],['tE3',0,1]].forEach(([id,mm,rr])=>document.getElementById(id).classList.toggle('right',m===mm&&Math.abs(r-rr)<.001&&Math.abs(mu-.03)<1e-4&&gR===0));
  const k=toCalc(W,r,mu,gR),ref=toCalc(TO.W,1.225,0.03,0);
  const x1=Math.max(1400,isFinite(k.SG)?Math.ceil(k.SG*1.1/100)*100:1400);
  const g=chart(document.getElementById('tCv'),{x0:0,x1,y0:0,y1:90,xl:'distance from brake release (m)',yl:'speed V (m/s)',fx:v=>fmt(v)});
  line(g,ref.V,0,ref.SG,css('--muted'),1.6,[5,4]);
  if(isFinite(k.SG)){line(g,k.V,0,k.SG,css('--accent'),2.8);dot(g,k.SG,k.VR,css('--signal'),'V_R at '+fmt(k.SG)+' m',k.SG>x1*0.7?-8:8,-12);}
  stats('tStats',[['T = (ρ/ρ₀) × 31,136',fmt(k.T)+' N'],['V<sub>stall</sub>',k.Vst.toFixed(2)+' m/s'],['V<sub>R</sub>',k.VR.toFixed(2)+' m/s'],['C',k.C.toFixed(4)],['D',(k.D*1e6).toFixed(4)+' × 10⁻⁶'],['D V<sub>R</sub>²',(k.D*k.VR*k.VR).toFixed(6)],
   ['ground roll S<sub>G</sub>',isFinite(k.SG)?fmt(k.SG)+' m':'cannot reach V_R',1],['rotation 1 to 3 × V<sub>R</sub>',fmt(k.VR)+' to '+fmt(3*k.VR)+' m']]);};
 M.oninput=R.oninput=Mu.oninput=Sl.oninput=u;u();}

/* ---------- step 18: climb ---------- */
function initClimb(){const Hs=document.getElementById('cH'),Ws=document.getElementById('cW');
 const u=()=>{const a=AC.lj,k=kOf(a),W=a.W*Ws.value/100,S=a.S,h=+Hs.value,r=rhoAt(h),T=a.T*r/RHO0,tw=T/W;setV('cH',fmt(h)+' m · T = '+fmt(T)+' N');setV('cW',Ws.value+'%');
  const gam=v=>{const cl=2*W/(r*v*v*S);return tw-(a.CD0+k*cl*cl)/cl;},roc=v=>v*gam(v);
  const Vs=Math.sqrt(2*W/(r*S*a.CLmax)),Vm=vmd(W,r,S,k,a.CD0),gm=tw-2*Math.sqrt(k*a.CD0);
  let vb=Vs,rb=-1e9;for(let v=Vs;v<=400;v+=0.25){const q=roc(v);if(q>rb){rb=q;vb=v;}}
  let x1=Math.min(400,Math.max(vb*1.6,Vm*2.2));
  const gTop=Math.max(20,Math.ceil(gam(Vs)*180/Math.PI/5+1)*5),rTop=Math.max(60,Math.ceil(rb/10+1)*10);
  let g=chart(document.getElementById('cG'),{x0:0,x1,y0:-5,y1:gTop,xl:'TAS (m/s)',yl:'γ (deg)',fy:v=>v.toFixed(0)});
  line(g,v=>gam(v)*180/Math.PI,Vs,x1,css('--accent'),2.8);dot(g,Vm,gm*180/Math.PI,css('--signal'),'V_MD steepest',8,-12);dot(g,vb,gam(vb)*180/Math.PI,css('--good'),'best rate',8,14);
  g=chart(document.getElementById('cV'),{x0:0,x1,y0:-10,y1:rTop,xl:'TAS (m/s)',yl:'V γ (m/s)',fy:v=>v.toFixed(0)});
  line(g,roc,Vs,x1,css('--accent'),2.8);dot(g,Vm,roc(Vm),css('--signal'),'V_MD',8,14);dot(g,vb,rb,css('--good'),'max V γ',8,14);
  stats('cStats',[['T/W',tw.toFixed(4)],['V<sub>MD</sub> (steepest)',Vm.toFixed(1)+' m/s',1],['γ<sub>max</sub> = T/W − 2√(kC<sub>D0</sub>)',gm.toFixed(4)+' rad ('+(gm*180/Math.PI).toFixed(1)+'°)',1],['V γ at V<sub>MD</sub>',roc(Vm).toFixed(1)+' m/s'],['best-rate speed (from curve)',vb.toFixed(1)+' m/s'],['max V γ',rb.toFixed(1)+' m/s']]);};
 Hs.oninput=Ws.oninput=u;u();}

/* ---------- per-step setup ---------- */
function setup(){
 const s=steps[cur];if(s.init)s.init();
 document.querySelectorAll('.reveal').forEach(rv=>{const ls=[...rv.querySelectorAll('.line')],rb=document.querySelector(`.revBtn[data-r="${rv.id}"]`),rs=document.querySelector(`.revReset[data-r="${rv.id}"]`);
  let n=+(rv.dataset.n||1);
  const show=()=>{rv.dataset.n=n;ls.forEach((l,i)=>l.classList.toggle('show',i<n));rb.disabled=n>=ls.length;rb.textContent=n>=ls.length?'All lines shown':'Reveal next line ('+n+'/'+ls.length+')';};
  rb.onclick=()=>{n++;show();};rs.onclick=()=>{n=1;show();};show();});
}
const redraw=()=>{if(!anim&&stage.querySelector('canvas'))setup();};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(redraw,150);});
render();
</script>
