  camera.lookAt(orbit.tx,orbit.ty,orbit.tz)}

  var nx=((cx-r.left)/w)*2-1,ny=1-((cy-r.top)/h)*2,nd=clamp(orbit.dist*f,0.8,60),k=nd/orbit.dist;

var UP=new T.Vector3(0,1,0);
function Arrow(color,r,head){

/* ---------- blade profile in the x-y plane. x is blade motion, flow runs toward -y.

function foilT(s){return 5*(0.2969*Math.sqrt(s)-0.1260*s-0.3516*s*s+0.2843*s*s*s-0.1036*s*s*s*s)}

  for(i=1;i<=N;i++)sh.lineTo(pts[i].x+pts[i].nx*pts[i].t,pts[i].y+pts[i].ny*pts[i].t);
  for(i=N;i>=0;i--)sh.lineTo(pts[i].x-pts[i].nx*pts[i].t,pts[i].y-pts[i].ny*pts[i].t);

/* cambered aerofoil blade for the 3D machines. chord along x, thickness along z, span along y from 0 to span */
function foilGeom(chord,span,tr,camber){
  var N=24,up=[],lo=[],i,m=camber||0;
  for(i=0;i<=N;i++){var s=(1-Math.cos(Math.PI*i/N))/2,yt=tr*foilT(s)*chord,yc=m*4*s*(1-s)*chord,sl=m*4*(1-2*s),th=Math.atan(sl),c=Math.cos(th),sn=Math.sin(th);

    s3.insertAdjacentHTML('beforeend','<p>No torque, adiabatic, isentropic. Angular momentum, mass and energy are conserved. Static state at 2 comes from T<sub>03</sub>, p<sub>03</sub> and C<sub>2</sub>.</p><div class="eq">1. C<sub>w2′</sub> = (r<sub>2</sub>/r<sub>2′</sub>) C<sub>w2</sub> = <b data-k="cw2p"></b> m/s<br>2. start with ρ<sub>2′</sub> = ρ<sub>2</sub> = <b data-k="rho2"></b> kg/m³ (T<sub>2</sub> = <b data-k="T2"></b> K, M<sub>2</sub> = <b data-k="M2"></b>)<br>3. C<sub>r2′</sub> = ρ<sub>2</sub>r<sub>2</sub>C<sub>r2</sub> / (ρ<sub>2′</sub>r<sub>2′</sub>)<br>4. C<sub>2′</sub>² = C<sub>r2′</sub>² + C<sub>w2′</sub>², then T<sub>2′</sub> = T<sub>03</sub> − C<sub>2′</sub>²/(2C<sub>p</sub>)<br>5. p<sub>2′</sub> = p<sub>03</sub>(T<sub>2′</sub>/T<sub>03</sub>)<sup>γ/(γ−1)</sup>, ρ<sub>2′</sub> = p<sub>2′</sub>/(RT<sub>2′</sub>)<br>6. repeat from 3 until ρ<sub>2′</sub> stops changing<br><span class="n">iteration log (ρ<sub>2′</sub>, kg/m³):</span> <b data-k="log"></b><br>Result: C<sub>r2′</sub> = <b data-k="cr2p"></b> m/s, T<sub>2′</sub> = <b data-k="T2p"></b> K, ρ<sub>2′</sub> = <b data-k="rho2p"></b> kg/m³<br>Diffuser channel angle = tan⁻¹(C<sub>r2′</sub>/C<sub>w2′</sub>) = <b data-k="ang"></b>° from the tangent</div>');
