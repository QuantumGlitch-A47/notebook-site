<div class="wrap">
  <header>
    <div class="course">ENG3039 Dynamics 3 · Chapter 7</div>
    <h1>Forced Vibration, Transient Response and Transfer Functions</h1>
  </header>
  <div class="rail" id="rail" aria-label="Steps"></div>
  <div class="progress"><i id="bar"></i></div>
  <main class="panel" id="stage" aria-live="polite"></main>
  <div class="nav">
    <button class="btn ghost" id="prev">← Back</button>
    <span class="hint">Use ← → keys to move between steps</span>
    <button class="btn" id="next">Next →</button>
  </div>
</div>

<script>
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const wn='ω<sub>n</sub>', wd='ω<sub>d</sub>', z='ζ', rt='√(1 − ζ²)';
const XSTEP=`x(t) = ${F('F₀','k')} [ 1 − e<sup>−${z}${wn}t</sup> ( cos ${wd}t + ${F(z,rt)} sin ${wd}t ) ]`;

const steps=[
{tag:"Step 1 · Free vs forced",title:"Chapter 6 let the mass go. Chapter 7 pushes it.",
 what:"A force F(t) now acts on the mass for t > 0. The right side of the equation of motion is no longer zero. Gravity still cancels with the static spring deflection (mg − kδ = 0).",
 mean:"The mass starts at rest at x = 0. The force drives it to a new resting position. The wobble on the way there is the transient. The new resting position is the steady state.",
 aim:"Find x(t) for a given input F(t), then measure how good the response is.",
 eq:`<span class="row">m ẍ + c ẋ + k x = <span class="hl">F(t)</span> <span class="note">forced vibration</span></span>
 <span class="row">ẍ + 2${z}${wn} ẋ + ${wn}² x = ${F('F(t)','m')} <span class="note">standard form, divide by m</span></span>`,
 extra:`<div><canvas id="msd1" height="150"></canvas><div class="cap">Sample system from the slides: m = 2.5 kg, k = 160 N/m, c = 4 N s/m, F₀ = 45 N. The arrow shows the step force switching on.</div></div>
 <div class="tablebox"><table class="vars"><tr><th>Symbol</th><th>Meaning</th><th>Units</th></tr>
 <tr><td>F(t), F₀</td><td>Applied force, and the size of a step force</td><td>N</td></tr>
 <tr><td>${wn} = √(k/m)</td><td>Undamped natural frequency</td><td>rad/s</td></tr>
 <tr><td>${z} = c/(2√(km))</td><td>Damping ratio</td><td>none</td></tr>
 <tr><td>${wd} = ${wn}√(1 − ζ²)</td><td>Damped natural frequency. A question asking for "the natural frequency" of a damped system means this one</td><td>rad/s</td></tr>
 <tr><td>x(∞)</td><td>Final steady-state displacement</td><td>m</td></tr>
 <tr><td>t<sub>r</sub>, t<sub>p</sub>, M<sub>p</sub>, t<sub>s</sub></td><td>Rise time, peak time, maximum overshoot, settling time</td><td>s, s, m or %, s</td></tr></table></div>`,
 teach:"Explain the difference between the transient response and the steady state, using the moving mass."},

{tag:"Step 2 · Transfer function",title:"One fraction that describes the system",
 what:"Take the Laplace transform with zero initial conditions, x(0) = 0 and ẋ(0) = 0. Every initial condition term vanishes. Divide output by input.",
 mean:"G(s) holds m, c and k only. It does not care which force you apply. It is the system's fingerprint.",
 aim:"Find G(s) once. Then any input gives the output by one multiplication: X(s) = G(s)·F(s).",
 eq:`<span class="row">(ms² + cs + k) X(s) = F(s)</span>
 <span class="row">G(s) = ${F('X(s)','F(s)')} = ${F('1','ms² + cs + k')} = ${F('1/m',`s² + 2${z}${wn}s + ${wn}²`)}</span>`,
 extra:`<div class="flow">
  <div class="box"><small>Input</small><b>F(s)</b><span class="hint">Step, ramp, exponential…</span></div>
  <div class="arrow">→</div>
  <div class="box s"><small>System</small><b>G(s)</b><span class="hint">Depends on m, c, k only</span></div>
  <div class="arrow">→</div>
  <div class="box"><small>Output</small><b>X(s) = G(s)·F(s)</b><span class="hint">Invert with the table to get x(t)</span></div></div>
  <p class="cap">The denominator of G(s) is the same characteristic equation as Chapter 6. Same roots, same three damping cases. You meet transfer functions again in ENG3015 Control 3.</p>`,
 teach:"Why does G(s) need zero initial conditions? What would appear in it otherwise?"},

{tag:"Step 3 · Standard inputs",title:"What you push with decides F(s)",
 what:"The slides list four standard inputs. Each has a simple Laplace transform from the table.",
 mean:"Same system, different input, different response. The system part G(s) stays fixed.",
 aim:"Turn the word description of a force into F(s). The exam focuses on step input.",
 extra:`<div class="tablebox"><table class="vars"><tr><th>Input</th><th>P(t), t ≥ 0</th><th>Laplace P(s)</th></tr>
 <tr><td>Step</td><td>a (constant)</td><td>${F('a','s')}</td></tr>
 <tr><td>Ramp</td><td>a t (a = slope)</td><td>${F('a','s²')}</td></tr>
 <tr><td>Step + ramp</td><td>P₀ + a t</td><td>${F('P₀','s')} + ${F('a','s²')}</td></tr>
 <tr><td>Exponential</td><td>P₀ e<sup>−bt</sup></td><td>${F('P₀','s + b')}</td></tr></table></div>
 <div class="ctrls" role="radiogroup" aria-label="Input type" id="inSel"></div>
 <div class="lab2"><div><canvas id="inCv" height="150"></canvas><div class="cap">Input force F(t), N</div></div>
 <div><canvas id="outCv" height="210"></canvas><div class="cap" id="outCap">Response x(t), m. Sample system: m = 2.5 kg, k = 160 N/m, c = 4 N s/m.</div></div></div>`,
 teach:"Pick the ramp. Explain why the mass keeps moving instead of settling."},

{tag:"Step 4 · Step response",title:"Derive x(t) for a step force F₀",
 what:"Put F(s) = F₀/s into the transfer function. Use the same four moves as Chapter 6: partial fractions, complete the square, split the numerator, invert.",
 mean:"The response is the final value F₀/k minus a decaying oscillation. The decaying part is the transient.",
 aim:"Get Eq. 7.5. Know where each piece comes from, so you can derive it when the question says \"from first principles\".",
 extra:`<div class="eq reveal" id="rev4">
 <span class="line"><span class="why">Objective: x(t) for F(t) = F₀, zero initial conditions, ζ &lt; 1</span>X(s) = G(s)·${F('F₀','s')} = ${F('F₀/m',`s(s² + 2${z}${wn}s + ${wn}²)`)}</span>
 <span class="line"><span class="why">Final value theorem first: x(∞) = lim s→0 of sX(s)</span>x(∞) = ${F('F₀/m',`${wn}²`)} = <span class="hl">${F('F₀','k')}</span> <span class="note">the static spring deflection</span></span>
 <span class="line"><span class="why">Partial fractions. Quadratic has no real roots, so keep it whole with Bs + C on top</span>${F('F₀/m',`s(s² + 2${z}${wn}s + ${wn}²)`)} = ${F('A','s')} + ${F('Bs + C',`s² + 2${z}${wn}s + ${wn}²`)}</span>
 <span class="line"><span class="why">Match powers: s²: A + B = 0. s¹: 2ζωₙA + C = 0. s⁰: ωₙ²A = F₀/m</span>A = ${F('F₀','k')}, &nbsp; B = −${F('F₀','k')}, &nbsp; C = −${F(`2${z}${wn}F₀`,'k')}</span>
 <span class="line"><span class="why">Complete the square in the denominator</span>X(s) = ${F('F₀','k')} [ ${F('1','s')} − ${F(`s + 2${z}${wn}`,`(s + ${z}${wn})² + ${wd}²`)} ]</span>
 <span class="line"><span class="why">Split the numerator: s + 2ζωₙ = (s + ζωₙ) + ζωₙ, and multiply by ωd/ωd</span>X(s) = ${F('F₀','k')} [ ${F('1','s')} − ${F(`s + ${z}${wn}`,`(s + ${z}${wn})² + ${wd}²`)} − ${F(`${z}${wn}`,wd)}·${F(wd,`(s + ${z}${wn})² + ${wd}²`)} ]</span>
 <span class="line"><span class="why">Invert: 1/s ↔ 1, then e<sup>−at</sup>cos and e<sup>−at</sup>sin with a = ζωₙ. Use ζωₙ/ωd = ζ/√(1 − ζ²)</span><span class="hl">${XSTEP}</span> <span class="note">Eq. 7.5</span></span></div>
 <div class="nav"><button class="btn" id="rev4Btn">Reveal next line</button><button class="btn ghost" id="rev4Reset">Start again</button></div>`,
 teach:"Point at x(t) and say which part is the steady state and which part is the transient."},

{tag:"Step 5 · Three damping cases",title:"Same push, three different dampers",
 what:"The overdamped and critically damped step responses come from the same method. The slides give them. All three end at F₀/k because every exponential dies out.",
 mean:"Underdamped overshoots. Critical arrives fastest without overshoot. Overdamped creeps up slowly.",
 aim:"Recognise the case from ζ, then pick the right equation. About 90% of real systems are underdamped.",
 eq:`<span class="row">ζ &lt; 1: &nbsp;${XSTEP} <span class="note">Eq. 7.5</span></span>
 <span class="row">ζ = 1: &nbsp;x(t) = ${F('F₀','k')} [ 1 − e<sup>−${wn}t</sup>(1 + ${wn}t) ] <span class="note">Eq. 7.7</span></span>
 <span class="row">ζ &gt; 1: &nbsp;x(t) = ${F('F₀','k')} [ 1 + A e<sup>−(ζ − √(ζ²−1))${wn}t</sup> + B e<sup>−(ζ + √(ζ²−1))${wn}t</sup> ] <span class="note">Eq. 7.6</span></span>
 <span class="row"><span class="note">A = (−ζ − √(ζ²−1)) / (2√(ζ²−1)), B = (ζ − √(ζ²−1)) / (2√(ζ²−1)). Check: A + B = −1, so x(0) = 0 ✓</span></span>`,
 extra:`<div><canvas id="race" height="320"></canvas><div class="cap">Three identical systems (ωₙ = 5 rad/s). The same step force switches on at the same moment. Only the damper changes. The second dashed line is the new resting position x(∞) = F₀/k.</div></div>
 <p class="cap">Link to Chapter 6: step response = F₀/k × (1 − free response from x₀ = 1). The same shapes, flipped upside down.</p>`,
 teach:"Which mass reaches the new dashed line first without passing it? Why would a car suspension designer care?"},

{tag:"Step 6 · Worked Examples 9 and 10",title:"Rotating beam with a step force",
 what:"Uniform beam, L = 1 m, m = 3 kg, pivot O. Damper c = 54 N s/m at a, force F(t) at 2a, spring k = 130 N/m at 3a = 1 m. So a = 1/3 m. Static position, so gravity cancels.",

{tag:"Step 10 · Peak time",title:"t<sub>p</sub>: the first peak, where velocity is zero",

 <span class="row">F₀/k ≠ 0, &nbsp; e<sup>−ζωₙt</sup> ≠ 0, &nbsp; ( … ) &gt; 0 &nbsp;⇒&nbsp; sin ωd t<sub>p</sub> = 0 <span class="note">product of terms = 0</span></span>

 <span class="row">M<sub>p</sub> = x(t<sub>p</sub>) − x(∞) = <span class="hl">x(∞) e<sup>−ζωₙt<sub>p</sub></sup> = x(∞) e<sup>−πζ/√(1 − ζ²)</sup></span></span>

const stage=document.getElementById('stage'), rail=document.getElementById('rail');
let cur=0, visited=new Set([0]), anims=[];
try{const s=parseInt(localStorage.getItem('ch7step'));if(s>=0&&s<steps.length)cur=s;}catch(e){}
steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=s.tag;b.onclick=()=>go(i);rail.appendChild(b);});
function go(i){cur=Math.max(0,Math.min(steps.length-1,i));visited.add(cur);try{localStorage.setItem('ch7step',cur)}catch(e){}render();window.scrollTo({top:0});}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const stopAnims=()=>{anims.forEach(a=>a.stop=true);anims=[];};
function loop(fn){const h={stop:false};anims.push(h);const f=ts=>{if(h.stop)return;fn(ts);requestAnimationFrame(f);};requestAnimationFrame(f);}
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(){
 stopAnims();
 const s=steps[cur];
 stage.innerHTML=`<div class="tag">${s.tag}</div><h2>${s.title}</h2>
 <div class="trio"><div class="cell what"><h3>What it is</h3><p>${s.what}</p></div>
 <div class="cell mean"><h3>What it means</h3><p>${s.mean}</p></div>
 <div class="cell aim"><h3>The aim</h3><p>${s.aim}</p></div></div>
 ${s.eq?`<div class="eq">${s.eq}</div>`:''}${s.extra||''}
`;
 [...rail.children].forEach((b,i)=>{b.className=(i===cur?'on':visited.has(i)?'done':'');});
 document.getElementById('bar').style.width=((cur+1)/steps.length*100)+'%';
 document.getElementById('prev').disabled=cur===0;
 document.getElementById('next').disabled=cur===steps.length-1;
 setup();
}

/* ---------- physics ---------- */
function freeR(zeta,w,t){
 if(Math.abs(zeta-1)<0.005)return(1+w*t)*Math.exp(-w*t);
 if(zeta<1){const r=Math.sqrt(1-zeta*zeta),d=w*r;return Math.exp(-zeta*w*t)*(Math.cos(d*t)+zeta/r*Math.sin(d*t));}
 const r=Math.sqrt(zeta*zeta-1),A=(zeta+r)/(2*r),B=(-zeta+r)/(2*r);
 return Math.exp(-zeta*w*t)*(A*Math.exp(w*r*t)+B*Math.exp(-w*r*t));
}
const stepR=(zeta,w,t)=>1-freeR(zeta,w,t);
const caseOf=zeta=>Math.abs(zeta-1)<0.005?'crit':zeta<1?'under':'over';
function metrics(zeta,w){
 if(zeta>=1)return{ts:-Math.log(0.05)/(zeta*w)};
 const r=Math.sqrt(1-zeta*zeta),d=w*r;
 return{wd:d,tr:(Math.PI-Math.atan(r/zeta))/d,tp:Math.PI/d,Mp:Math.exp(-Math.PI*zeta/r),ts:3/(zeta*w)};
}
function sim(m,c,k,Ff,T,dt=0.002){let x=0,v=0;const out=[[0,0]];const a=(t,x,v)=>(Ff(t)-c*v-k*x)/m;
 for(let t=0;t<T;t+=dt){const k1x=v,k1v=a(t,x,v),k2x=v+dt/2*k1v,k2v=a(t+dt/2,x+dt/2*k1x,v+dt/2*k1v),
  k3x=v+dt/2*k2v,k3v=a(t+dt/2,x+dt/2*k2x,v+dt/2*k2v),k4x=v+dt*k3v,k4v=a(t+dt,x+dt*k3x,v+dt*k3v);
  x+=dt/6*(k1x+2*k2x+2*k3x+k4x);v+=dt/6*(k1v+2*k2v+2*k3v+k4v);out.push([t+dt,x]);}return out;}

/* ---------- drawing ---------- */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const caseCol=k=>({under:css('--accent'),crit:css('--good'),over:css('--signal')}[k]);
function prep(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth;cv._h=cv._h||cv.height;
 cv.width=w*dpr;cv.height=cv._h*dpr;cv.style.height=cv._h+'px';const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,cv._h);return[c,w,cv._h];}
function nice(r){const p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return(f<1.5?1:f<3?2:f<7?5:10)*p;}
function fmt(v,st){const d=Math.max(0,-Math.floor(Math.log10(st)+1e-9));return v.toFixed(Math.min(d,3));}
function axes(c,W,H,pad,tMax,yMin,yMax,ylab){
 const X=t=>pad.l+(t/tMax)*(W-pad.l-pad.r), Y=v=>pad.t+(yMax-v)/(yMax-yMin)*(H-pad.t-pad.b);
 c.strokeStyle=css('--grid');c.lineWidth=1;c.fillStyle=css('--muted');c.font='11px "JetBrains Mono", monospace';
 const ys=nice((yMax-yMin)/4);
 for(let v=Math.ceil(yMin/ys)*ys;v<=yMax+1e-9;v+=ys){c.beginPath();c.moveTo(pad.l,Y(v));c.lineTo(W-pad.r,Y(v));c.stroke();c.textAlign='right';c.textBaseline='middle';c.fillText(fmt(v,ys),pad.l-6,Y(v));}
 const xs=nice(tMax/5);
 for(let t=0;t<=tMax+1e-9;t+=xs){c.beginPath();c.moveTo(X(t),pad.t);c.lineTo(X(t),H-pad.b);c.stroke();c.textAlign='center';c.textBaseline='top';c.fillText(fmt(t,xs)+'s',X(t),H-pad.b+5);}
 c.strokeStyle=css('--muted');c.beginPath();c.moveTo(pad.l,Y(0));c.lineTo(W-pad.r,Y(0));c.stroke();
 if(ylab){c.textAlign='left';c.textBaseline='top';c.fillText(ylab,pad.l+4,pad.t+2);}
 return[X,Y];
}
function curve(c,X,Y,f,tMax,col,lw,dash){c.strokeStyle=col;c.lineWidth=lw;c.setLineDash(dash||[]);c.beginPath();
 for(let i=0;i<=500;i++){const t=tMax*i/500,v=f(t);i?c.lineTo(X(t),Y(v)):c.moveTo(X(t),Y(v));}c.stroke();c.setLineDash([]);}
function hline(c,X,Y,T,v,col,dash){c.strokeStyle=col;c.lineWidth=1.2;c.setLineDash(dash||[5,4]);c.beginPath();c.moveTo(X(0),Y(v));c.lineTo(X(T),Y(v));c.stroke();c.setLineDash([]);}
function dot(c,x,y,col){c.fillStyle=col;c.beginPath();c.arc(x,y,5.5,0,7);c.fill();c.strokeStyle=css('--panel');c.lineWidth=2;c.stroke();}
function tag(c,x,y,txt,col,al){c.fillStyle=col;c.font='600 11px "JetBrains Mono", monospace';c.textAlign=al||'left';c.textBaseline='bottom';c.fillText(txt,x,y);}

/* mass-spring-damper with step force; x in units of x(∞) */
function drawMSD(c,W,cy,x,o={}){
 const wall=24,eq0=W*0.36,amp=W*0.24,mx=eq0+x*amp,mw=54,mh=50,top=cy-40,bot=cy+40,zeta=o.zeta??0.1;
 c.fillStyle=css('--muted');for(let y=top;y<bot;y+=8)c.fillRect(0,y,wall,1);c.fillRect(wall-2,top,3,bot-top);
 c.lineWidth=1;c.setLineDash([4,4]);c.strokeStyle=css('--muted');c.beginPath();c.moveTo(eq0,top);c.lineTo(eq0,bot);c.stroke();
 c.strokeStyle=css('--good');c.beginPath();c.moveTo(eq0+amp,top);c.lineTo(eq0+amp,bot);c.stroke();c.setLineDash([]);
 const x0=wall,x1=mx-mw/2,y1=cy-12,n=12;
 c.strokeStyle=css('--accent');c.lineWidth=2;c.beginPath();c.moveTo(x0,y1);for(let i=1;i<=n;i++)c.lineTo(x0+(x1-x0)*i/n,y1+(i===n?0:(i%2?-8:8)));c.stroke();
 const y2=cy+14,g=4+Math.min(zeta,2.5)*4.5,cw=30,cx0=x0+14,pist=Math.max(cx0+6,Math.min(cx0+cw-4,x1-50));
 c.strokeStyle=css('--signal');c.lineWidth=1.5+Math.min(zeta,2.5)*0.8;c.fillStyle=css('--accent-soft');c.fillRect(cx0,y2-g,cw,2*g);c.beginPath();
 c.moveTo(x0,y2);c.lineTo(cx0,y2);c.moveTo(cx0,y2-g);c.lineTo(cx0+cw,y2-g);c.moveTo(cx0,y2+g);c.lineTo(cx0+cw,y2+g);c.moveTo(cx0,y2-g);c.lineTo(cx0,y2+g);
 c.moveTo(pist,y2-g+3);c.lineTo(pist,y2+g-3);c.moveTo(pist,y2);c.lineTo(x1,y2);c.stroke();
 c.fillStyle=o.col||css('--ink');c.fillRect(x1,cy-mh/2,mw,mh);
 c.fillStyle=css('--panel');c.font='600 15px "Space Grotesk", sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('m',mx,cy);
 if(o.force){const ay=cy-mh/2-9;c.strokeStyle=css('--warn');c.fillStyle=css('--warn');c.lineWidth=2.5;c.beginPath();c.moveTo(mx-22,ay);c.lineTo(mx+16,ay);c.stroke();
  c.beginPath();c.moveTo(mx+22,ay);c.lineTo(mx+13,ay-5);c.lineTo(mx+13,ay+5);c.fill();c.font='600 11px "JetBrains Mono", monospace';c.textAlign='right';c.fillText('F₀',mx-26,ay+1);}
 if(o.label){c.fillStyle=o.col||css('--ink');c.font='600 12px "JetBrains Mono", monospace';c.textAlign='left';c.textBaseline='top';c.fillText(o.label,wall+8,top);}
 return[eq0,eq0+amp];
}
function msdFooter(c,W,H,eqs,t){c.font='11px "JetBrains Mono", monospace';c.textBaseline='alphabetic';c.textAlign='center';
 c.fillStyle=css('--muted');c.fillText('x = 0',eqs[0],H-4);c.fillStyle=css('--good');c.fillText('x(∞) = F₀/k',eqs[1],H-4);
 if(t!=null){c.fillStyle=css('--muted');c.textAlign='right';c.fillText('t = '+t.toFixed(2)+' s',W-4,H-4);}}
/* time loop helper: hold 0.8 s at rest, then run T, then hold 1.2 s */
function clock(t0,ts,T){const tt=((ts-t0)/1000)%(T+2);return tt<0.8?-1:Math.min(tt-0.8,T);}

/* ---------- per-step setup ---------- */
function setupReveal(id){const rb=document.getElementById(id+'Btn');if(!rb)return;const ls=[...document.querySelectorAll('#'+id+' .line')];let n=1;
 const show=()=>{ls.forEach((l,i)=>l.classList.toggle('show',i<n));rb.disabled=n>=ls.length;rb.textContent=n>=ls.length?'All lines shown':'Reveal next line ('+n+'/'+ls.length+')';};
 rb.onclick=()=>{n++;show();};document.getElementById(id+'Reset').onclick=()=>{n=1;show();};show();}

function setup(){
 ['rev4','rev6','rev7','rev14','rev15'].forEach(setupReveal);

 const m1=document.getElementById('msd1');
 if(m1){const z0=0.1,w0=8,T=4;let t0=null;const draw=ts=>{if(t0===null)t0=ts;const t=red?T:clock(t0,ts,T);
   const[c,W,H]=prep(m1),eqs=drawMSD(c,W,H/2-8,t<0?0:stepR(z0,w0,t),{zeta:z0,force:t>=0});msdFooter(c,W,H,eqs,Math.max(0,t));};
  red?draw(0):loop(draw);}

 const sel=document.getElementById('inSel');
 if(sel){const m=2.5,k=160,T=4;let cz=4;
  const inputs={step:['Step 45 N',t=>45],ramp:['Ramp 15t N',t=>15*t],sr:['Step + ramp 20 + 10t',t=>20+10*t],exp:['Exponential 45e⁻ᵗ',t=>45*Math.exp(-t)]};
  let curIn='step';
  Object.entries(inputs).forEach(([key,[lab]])=>{const b=document.createElement('button');b.className='opt';b.textContent=lab;b.setAttribute('role','radio');b.onclick=()=>{curIn=key;draw();};b.dataset.k=key;sel.appendChild(b);});
  const zc=document.createElement('div');zc.className='ctrl';zc.innerHTML='<label for="cz"><span>Damping c (N s/m)</span><span id="czv">4</span></label><input id="cz" type="range" min="1" max="60" step="1" value="4">';sel.appendChild(zc);
  const draw=()=>{[...sel.querySelectorAll('.opt')].forEach(b=>{const on=b.dataset.k===curIn;b.classList.toggle('right',on);b.setAttribute('aria-checked',on);});
   cz=+document.getElementById('cz').value;document.getElementById('czv').textContent=cz;
   const Ff=inputs[curIn][1],data=sim(m,cz,k,Ff,T);
   {const[c,W,H]=prep(document.getElementById('inCv')),fmax=Math.max(...[0,1,2,3,4].map(Ff),50);const[X,Y]=axes(c,W,H,{l:44,r:12,t:10,b:22},T,0,fmax*1.05);curve(c,X,Y,Ff,T,css('--warn'),2.5);}
   {const[c,W,H]=prep(document.getElementById('outCv'));let mx=Math.max(...data.map(d=>d[1])),mn=Math.min(0,...data.map(d=>d[1]));
    const[X,Y]=axes(c,W,H,{l:44,r:12,t:10,b:22},T,mn,mx*1.1);c.strokeStyle=css('--accent');c.lineWidth=2.5;c.beginPath();data.forEach(([t,x],i)=>{if(i%4)return;i?c.lineTo(X(t),Y(x)):c.moveTo(X(t),Y(x));});c.stroke();
    if(curIn==='step'){hline(c,X,Y,T,45/k,css('--good'));tag(c,X(T)-4,Y(45/k)-4,'x(∞) = F₀/k = 0.281 m',css('--good'),'right');}}
   const z=cz/(2*Math.sqrt(k*m));document.getElementById('outCap').textContent='Response x(t), m. m = 2.5 kg, k = 160 N/m, c = '+cz+' N s/m → ζ = '+z.toFixed(2)+'. Simulated directly from the equation of motion.';};
  document.getElementById('cz').oninput=draw;draw();}

 const race=document.getElementById('race');
 if(race){const rows=[[0.2,'ζ = 0.2  under-damped','under'],[1,'ζ = 1  critical','crit'],[2,'ζ = 2  over-damped','over']],T=2.5;let t0=null;
  const draw=ts=>{if(t0===null)t0=ts;const t=red?0.5:clock(t0,ts,T);const[c,W,H]=prep(race);let eqs;
   rows.forEach(([zeta,label,k],i)=>{eqs=drawMSD(c,W,55+i*100,t<0?0:stepR(zeta,5,t),{zeta,col:caseCol(k),label,force:t>=0});});msdFooter(c,W,H,eqs,Math.max(0,t));};
  red?draw(0):loop(draw);}

 const zs=document.getElementById('zs');
 if(zs){const ws=document.getElementById('ws'),pc=document.getElementById('perfCv'),mc=document.getElementById('msd8');let t0=null;
  const win=(zeta,w)=>{const M=metrics(zeta,w);return Math.min(12,Math.max(M.ts*1.15,(M.tp||0)*3,1));};
  const drawPerf=(zeta,w,tc)=>{const[c,W,H]=prep(pc),T=win(zeta,w),M=metrics(zeta,w),k=caseOf(zeta),col=caseCol(k);
   const[X,Y]=axes(c,W,H,{l:40,r:14,t:16,b:24},T,0,Math.max(1.25,1+(M.Mp||0)+0.12));
   c.fillStyle=css('--accent-soft');c.fillRect(X(0),Y(1.05),X(T)-X(0),Y(0.95)-Y(1.05));
   hline(c,X,Y,T,1,css('--good'));tag(c,X(T)-2,Y(1.05)-2,'x(∞)  ±5%',css('--good'),'right');
   curve(c,X,Y,t=>stepR(zeta,w,t),T,col,2.5);
   if(M.tr!=null){const mk=(t,v,txt,cl)=>{c.strokeStyle=cl;c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(X(t),Y(0));c.lineTo(X(t),Y(v));c.stroke();c.setLineDash([]);dot(c,X(t),Y(v),cl);tag(c,X(t)+6,Y(0)-4,txt,cl);};
    mk(M.tr,1,'tr',css('--accent'));mk(M.tp,1+M.Mp,'tp',css('--signal'));
    c.strokeStyle=css('--signal');c.lineWidth=2;c.beginPath();c.moveTo(X(M.tp)+14,Y(1));c.lineTo(X(M.tp)+14,Y(1+M.Mp));c.stroke();tag(c,X(M.tp)+18,Y(1+M.Mp/2)+6,'Mp',css('--signal'));}
   if(M.ts<T){c.strokeStyle=css('--warn');c.lineWidth=1.5;c.beginPath();c.moveTo(X(M.ts),Y(0));c.lineTo(X(M.ts),Y(1.05)-10);c.stroke();tag(c,X(M.ts)+4,Y(1.05)-10,'ts',css('--warn'));}
   if(tc!=null&&tc>=0){c.strokeStyle=css('--muted');c.lineWidth=1;c.beginPath();c.moveTo(X(tc),Y(0));c.lineTo(X(tc),Y(1.2));c.stroke();dot(c,X(tc),Y(stepR(zeta,w,tc)),col);}
   return T;};
  const upd=()=>{const zeta=+zs.value,w=+ws.value,M=metrics(zeta,w),k=caseOf(zeta);
   document.getElementById('zv').textContent=zeta.toFixed(2);document.getElementById('wv').textContent=w.toFixed(1);
   const b=document.getElementById('caseBadge');b.textContent={under:'Under-damped · ζ < 1',crit:'Critically damped · ζ = 1',over:'Over-damped · ζ > 1'}[k];b.style.color=caseCol(k);
   const card=(lab,val,f,cl)=>`<div class="mcard" style="border-color:${cl}"><small>${lab}</small><b>${val}</b><span>${f}</span></div>`;
   document.getElementById('metrics').innerHTML=M.tr!=null?
    card('Rise time tr',M.tr.toFixed(3)+' s','(π − tan⁻¹(√(1−ζ²)/ζ)) / ωd',css('--accent'))+card('Peak time tp',M.tp.toFixed(3)+' s','π / ωd',css('--signal'))+
    card('Max overshoot Mp',(M.Mp*100).toFixed(1)+' %','100 e^(−πζ/√(1−ζ²))',css('--signal'))+card('Settling time ts',M.ts.toFixed(2)+' s','3 / (ζωₙ)',css('--warn'))
    :card('Rise / peak / overshoot','none','ζ ≥ 1 never passes x(∞)',css('--muted'))+card('Settling time ts',M.ts.toFixed(2)+' s','time to enter ±5%',css('--warn'));
   t0=null;if(red){const[c,W,H]=prep(mc),eqs=drawMSD(c,W,H/2-8,1,{zeta,col:caseCol(k),force:true});msdFooter(c,W,H,eqs);drawPerf(zeta,w);}};
  zs.oninput=upd;ws.oninput=upd;upd();
  if(!red)loop(ts=>{const zeta=+zs.value,w=+ws.value;if(t0===null)t0=ts;const T=win(zeta,w),t=clock(t0,ts,T);
   const[c,W,H]=prep(mc),eqs=drawMSD(c,W,H/2-8,t<0?0:stepR(zeta,w,t),{zeta,col:caseCol(caseOf(zeta)),force:t>=0});msdFooter(c,W,H,eqs,Math.max(0,t));drawPerf(zeta,w,t);});}

 const mp=document.getElementById('mpCv');
 if(mp){const[c,W,H]=prep(mp),pad={l:44,r:14,t:12,b:26};const X=v=>pad.l+v*(W-pad.l-pad.r),Y=v=>pad.t+(100-v)/100*(H-pad.t-pad.b);
  c.strokeStyle=css('--grid');c.fillStyle=css('--muted');c.font='11px "JetBrains Mono", monospace';c.lineWidth=1;
  [0,25,50,75,100].forEach(v=>{c.beginPath();c.moveTo(pad.l,Y(v));c.lineTo(W-pad.r,Y(v));c.stroke();c.textAlign='right';c.textBaseline='middle';c.fillText(v+'%',pad.l-6,Y(v));});
  [0,0.2,0.4,0.6,0.8,1].forEach(v=>{c.beginPath();c.moveTo(X(v),pad.t);c.lineTo(X(v),H-pad.b);c.stroke();c.textAlign='center';c.textBaseline='top';c.fillText('ζ='+v,X(v),H-pad.b+5);});
  c.strokeStyle=css('--signal');c.lineWidth=2.5;c.beginPath();for(let i=0;i<=200;i++){const zz=i/200*0.999,v=100*Math.exp(-Math.PI*zz/Math.sqrt(1-zz*zz));i?c.lineTo(X(zz),Y(v)):c.moveTo(X(zz),Y(v));}c.stroke();
  [[0.1,72.9],[0.25,44.4],[0.35,30.9]].forEach(([zz,v])=>{dot(c,X(zz),Y(v),css('--accent'));tag(c,X(zz)+8,Y(v)-2,v+'%',css('--accent'));});}

 const eff=document.getElementById('effCv');
 if(eff){const[c,W,H]=prep(eff),T=4;const[X,Y]=axes(c,W,H,{l:44,r:12,t:12,b:24},T,0,0.5);hline(c,X,Y,T,0.281,css('--good'));
  [[0.1,'--signal'],[0.25,'--warn'],[0.35,'--accent']].forEach(([zz,cl])=>curve(c,X,Y,t=>0.281*stepR(zz,8,t),T,css(cl),2.2));}

 const e12=document.getElementById('ex12Cv');
 if(e12){const[c,W,H]=prep(e12),T=2,zeta=3/Math.sqrt(130),w=Math.sqrt(130),th=2/13,M=metrics(zeta,w);
  const[X,Y]=axes(c,W,H,{l:48,r:12,t:12,b:24},T,0,0.25,'θ (rad)');
  c.fillStyle=css('--accent-soft');c.fillRect(X(0),Y(th*1.05),X(T)-X(0),Y(th*0.95)-Y(th*1.05));hline(c,X,Y,T,th,css('--good'));
  curve(c,X,Y,t=>th*stepR(zeta,w,t),T,css('--accent'),2.5);
  dot(c,X(M.tr),Y(th),css('--accent'));tag(c,X(M.tr)+7,Y(th)+16,'tr = 0.167 s',css('--accent'));
  dot(c,X(M.tp),Y(th*(1+M.Mp)),css('--signal'));tag(c,X(M.tp)+8,Y(th*(1+M.Mp))+4,'tp = 0.286 s, Mp = 0.0654 rad',css('--signal'));
  c.strokeStyle=css('--warn');c.lineWidth=1.5;c.beginPath();c.moveTo(X(1),Y(0));c.lineTo(X(1),Y(th*1.05)-8);c.stroke();tag(c,X(1)+5,Y(th*1.05)-8,'ts = 1.0 s',css('--warn'));}

 const qz=document.getElementById('quiz');if(qz){quiz.forEach((q,qi)=>{const d=document.createElement('div');d.className='q';
  d.innerHTML=`<p>${qi+1}. ${q.q}</p><div class="opts"></div><div class="fb"></div>`;const os=d.querySelector('.opts'),fb=d.querySelector('.fb');
  q.o.forEach((o,oi)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{
   [...os.children].forEach(x=>x.classList.remove('right','wrong'));b.classList.add(oi===q.a?'right':'wrong');
   fb.textContent=(oi===q.a?'Correct. ':'Not quite. ')+q.f;};os.appendChild(b);});qz.appendChild(d);});}
}
const redraw=()=>{if(!anims.length&&stage.querySelector('canvas'))setup();};
let rtm;addEventListener('resize',()=>{clearTimeout(rtm);rtm=setTimeout(()=>{if(!anims.length&&!document.getElementById('quiz')){render();}},150);});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!anims.length)render();});
render();
</script>
