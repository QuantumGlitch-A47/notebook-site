  camera.position.set(orbit.tx+orbit.dist*sp*Math.cos(orbit.th),orbit.ty+orbit.dist*Math.cos(orbit.ph),orbit.tz+orbit.dist*sp*Math.sin(orbit.th));
  camera.lookAt(orbit.tx,orbit.ty,orbit.tz)}
function setCam(c){for(var k in c)orbit[k]=c[k]}
var ptrs={};
var panMode=false,tools=el('div','tools'),bOrb=el('button',null,'Orbit'),bPan=el('button',null,'Slide');
bOrb.type='button';bPan.type='button';tools.appendChild(bOrb);tools.appendChild(bPan);stageEl.appendChild(tools);

bOrb.addEventListener('click',function(){setMode(false)});bPan.addEventListener('click',function(){setMode(true)});
['pointerdown','dblclick','wheel'].forEach(function(n){tools.addEventListener(n,function(e){e.stopPropagation()})});
setMode(false);
function panBy(dx,dy){
  var h=Math.max(stageEl.clientHeight,1),s=2*orbit.dist*Math.tan(camera.fov*D2R/2)/h;

  var r=stageEl.getBoundingClientRect(),w=Math.max(r.width,1),h=Math.max(r.height,1);
  var nx=((cx-r.left)/w)*2-1,ny=1-((cy-r.top)/h)*2,nd=clamp(orbit.dist*f,0.8,60),k=nd/orbit.dist;

  ptrs[e.pointerId]={x:e.clientX,y:e.clientY,pan:panMode||e.button===2||e.button===1||e.shiftKey};
  try{stageEl.setPointerCapture(e.pointerId)}catch(_){}});

    if(p.pan)panBy(dx,dy);else{orbit.th-=dx*0.008;orbit.ph=clamp(orbit.ph-dy*0.008,0.08,3.05)}}

/* ---------- 3D arrow (shaft + head), set from point a to point b ---------- */
var UP=new T.Vector3(0,1,0);
function Arrow(color,r,head){
  this.r=r||0.035;this.head=head||0.16;

  this.g=new T.Group();
  this.shaft=new T.Mesh(new T.CylinderGeometry(1,1,1,10),m);

  var d=b.clone().sub(a),L=d.length();

function V3(x,y,z){return new T.Vector3(x,y,z)}

/* ---------- blade profile in the x-y plane. x is blade motion, flow runs toward -y.
   sgn=-1: rotor metal follows relative flow. sgn=+1: stator or NGV metal follows absolute flow. ---------- */
function foilT(s){return 5*(0.2969*Math.sqrt(s)-0.1260*s-0.3516*s*s+0.2843*s*s*s-0.1036*s*s*s*s)}

  var N=30,pts=[],x=0,y=0,i,sp=0;
  for(i=0;i<=N;i++){var s=(1-Math.cos(Math.PI*i/N))/2,psi=psi1+(psi2-psi1)*s;
    if(i>0){var ds=s-sp;x+=sgn*Math.sin(psi)*chord*ds;y-=Math.cos(psi)*chord*ds}sp=s;
    var tx=sgn*Math.sin(psi),ty=-Math.cos(psi);
    pts.push({x:x,y:y,nx:-ty,ny:tx,t:thick*foilT(s)})}

  sh.moveTo(pts[0].x+pts[0].nx*pts[0].t,pts[0].y+pts[0].ny*pts[0].t);
  for(i=1;i<=N;i++)sh.lineTo(pts[i].x+pts[i].nx*pts[i].t,pts[i].y+pts[i].ny*pts[i].t);
  for(i=N;i>=0;i--)sh.lineTo(pts[i].x-pts[i].nx*pts[i].t,pts[i].y-pts[i].ny*pts[i].t);
  sh.closePath();

  g.translate(0,0,-span/2);g.computeBoundingBox();return g}
/* cambered aerofoil blade for the 3D machines. chord along x, thickness along z, span along y from 0 to span */
function foilGeom(chord,span,tr,camber){
  var N=24,up=[],lo=[],i,m=camber||0;
  for(i=0;i<=N;i++){var s=(1-Math.cos(Math.PI*i/N))/2,yt=tr*foilT(s)*chord,yc=m*4*s*(1-s)*chord,sl=m*4*(1-2*s),th=Math.atan(sl),c=Math.cos(th),sn=Math.sin(th);

  for(i=1;i<=N;i++)sh.lineTo(up[i][0],up[i][1]);
  for(i=N-1;i>=0;i--)sh.lineTo(lo[i][0],lo[i][1]);
  sh.closePath();
  var g=new T.ExtrudeGeometry(sh,{depth:span,bevelEnabled:false});
  g.rotateX(-Math.PI/2);return g}

function trailPoints(pg,hex,hist){

  g.setAttribute('position',new T.BufferAttribute(pos,3));g.setAttribute('alpha',new T.BufferAttribute(al,1));g.setAttribute('vcol',new T.BufferAttribute(vc,3));
  var c=new T.Color(hex);
